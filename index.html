                        <span className="bg-indigo-50 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md">
                          Toán Khối {quiz.grade} {quiz.isCTM2025 && '• CTM 2025'}
                        </span>
                        <span className="text-xs text-slate-500 font-medium flex items-center gap-1">
                          <Clock className="w-3.5 h-3.5" />
                          {quiz.duration} phút
                        </span>
                      </div>

                      <h4 className="font-bold text-slate-900 text-lg leading-snug mb-2">
                        {quiz.title}
                      </h4>

                      <p className="text-xs text-slate-600 mb-4 line-clamp-2">
                        {quiz.description}
                      </p>
                    </div>
                    <div className="text-xs text-slate-500 flex justify-between">
                        <span>{quiz.isCTM2025 ? '15 Câu Hỏi (3 Phần)' : `${quiz.questions.length} câu`}</span>
                        <span className="text-emerald-600 font-bold">Thang điểm 10.0</span>
                    </div>

                    <div className="pt-4 border-t border-slate-100 flex items-center justify-end">
                      <button
                        onClick={() => startQuiz(quiz)}
                        className="flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-sm transition-all"
                      >
                        <span>Vào Làm Bài</span>
                        <ChevronRight className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {showSavedAccountModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-lg w-full overflow-hidden">
                <div className="bg-indigo-900 p-5 text-white flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <Database className="w-5 h-5 text-yellow-300" />
                    <h3 className="font-bold text-base">Danh sách các tài khoản đã lưu ({registeredStudents.length})</h3>
                  </div>
                  <button onClick={() => setShowSavedAccountModal(false)} className="text-white/80 hover:text-white">
                    <XCircle className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-5 max-h-80 overflow-y-auto space-y-2">
                  {registeredStudents.map((st, idx) => {
                    const isMe = st.phone === currentStudent?.phone;
                    return (
                      <div 
                        key={idx} 
                        className={`p-3 rounded-2xl border text-xs flex items-center justify-between ${
                          isMe ? 'bg-indigo-50 border-indigo-300 ring-1 ring-indigo-400' : 'bg-slate-50 border-slate-200'
                        }`}
                      >
                        <div>
                          <div className="font-bold text-slate-900 flex items-center gap-2">
                            <span>{st.name}</span>
                            {isMe && <span className="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-full">Bạn</span>}
                            {st.isPremium ? <span className="bg-amber-400 text-slate-900 text-[10px] px-2 py-0.5 rounded-full font-bold">VIP</span> : <span className="bg-slate-200 text-slate-700 text-[10px] px-2 py-0.5 rounded-full">Thường</span>}
                          </div>
                          <div className="text-slate-500 mt-0.5">
                            SĐT: <span className="font-mono font-bold text-slate-800">{st.phone}</span> | Mật khẩu: <span className="font-mono text-slate-800">{st.password}</span>
                          </div>
                        </div>
                        <span className="bg-slate-200 text-slate-800 text-[10px] font-bold px-2 py-1 rounded-lg">
                          Khối {st.grade}
                        </span>
                      </div>
                    );
                  })}
                </div>

                <div className="p-4 bg-slate-50 border-t border-slate-100 text-right">
                  <button
                    onClick={() => setShowSavedAccountModal(false)}
                    className="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold"
                  >
                    Đóng
                  </button>
                </div>
              </div>
            </div>
          )}

          {showProfileModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-md w-full overflow-hidden">
                <div className="bg-gradient-to-r from-indigo-700 via-indigo-800 to-slate-900 p-5 text-white flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <User className="w-5 h-5 text-yellow-300" />
                    <h3 className="font-bold text-base">Đổi Thông Tin Cá Nhân</h3>
                  </div>
                  <button onClick={() => setShowProfileModal(false)} className="text-white/80 hover:text-white">
                    <XCircle className="w-6 h-6" />
                  </button>
                </div>

                <form onSubmit={handleProfileSubmit} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                      <Phone className="w-3.5 h-3.5 text-indigo-600" />
                      Số điện thoại (Mã tài khoản)
                    </label>
                    <input
                      type="text"
                      disabled
                      value={currentStudent?.phone || ''}
                      className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-mono text-slate-500 cursor-not-allowed"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                      <User className="w-3.5 h-3.5 text-indigo-600" />
                      Họ và Tên Học Sinh *
                    </label>
                    <input
                      type="text"
                      value={editName}
                      onChange={(e) => setEditName(e.target.value)}
                      placeholder="Nhập họ và tên..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                      <GraduationCap className="w-3.5 h-3.5 text-indigo-600" />
                      Khối Lớp Học *
                    </label>
                    <select
                      value={editGrade}
                      onChange={(e) => setEditGrade(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="10">Khối 10 (Lớp 10)</option>
                      <option value="11">Khối 11 (Lớp 11)</option>
                      <option value="12">Khối 12 (Lớp 12)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                      <KeyRound className="w-3.5 h-3.5 text-indigo-600" />
                      Mật khẩu mới *
                    </label>
                    <input
                      type="text"
                      value={editPassword}
                      onChange={(e) => setEditPassword(e.target.value)}
                      placeholder="Nhập mật khẩu mới..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      required
                    />
                  </div>

                  <div className="flex gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowProfileModal(false)}
                      className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all"
                    >
                      Hủy bỏ
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md transition-all flex items-center justify-center gap-1.5"
                    >
                      <CheckCircle className="w-4 h-4" />
                      <span>Lưu Thay Đổi</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showHistoryModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-2xl w-full overflow-hidden flex flex-col max-h-[85vh]">
                <div className="bg-gradient-to-r from-emerald-700 via-teal-800 to-slate-900 p-5 text-white flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <BarChart2 className="w-5 h-5 text-yellow-300" />
                    <div>
                      <h3 className="font-bold text-base">Lịch Sử & Kết Quả Đã Làm Bài</h3>
                      <p className="text-[11px] text-emerald-200">Học sinh: {currentStudent?.name}</p>
                    </div>
                  </div>
                  <button onClick={() => setShowHistoryModal(false)} className="text-white/80 hover:text-white">
                    <XCircle className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-5 bg-slate-50 border-b border-slate-200 grid grid-cols-3 gap-3 text-center">
                  <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Tổng Số Bài</span>
                    <span className="text-xl font-extrabold text-indigo-700">{totalTests}</span>
                  </div>
                  <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Điểm Trung Bình</span>
                    <span className="text-xl font-extrabold text-emerald-600">{avgScore}</span>
                  </div>
                  <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Điểm Cao Nhất</span>
                    <span className="text-xl font-extrabold text-amber-500">{maxScore}</span>
                  </div>
                </div>

                <div className="p-5 overflow-y-auto flex-1 space-y-3">
                  {studentHistory.length === 0 ? (
                    <div className="text-center py-10 space-y-2">
                      <Award className="w-10 h-10 text-slate-300 mx-auto" />
                      <p className="text-sm font-bold text-slate-600">Bạn chưa làm bài tập nào</p>
                      <p className="text-xs text-slate-400">Hãy chọn một đề thi trong thư mục khối lớp để luyện tập ngay nhé!</p>
                    </div>
                  ) : (
                    studentHistory.map((rec, idx) => (
                      <div key={rec.id || idx} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-4">
                        <div className="space-y-1">
                          <span className="bg-indigo-50 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded-md">
                            Khối {rec.grade}
                          </span>
                          <h4 className="font-bold text-slate-900 text-sm leading-snug">{rec.quizTitle}</h4>
                          <div className="text-xs text-slate-500 flex items-center gap-3">
                            <span className="flex items-center gap-1"><Clock className="w-3.5 h-3.5" /> {rec.submittedAt}</span>
                            <span>•</span>
                            <span>Số câu đúng: <strong>{rec.correctCount}/{rec.totalQuestions}</strong></span>
                          </div>
                        </div>

                        <div className="text-right shrink-0">
                          <span className={`font-extrabold px-3 py-1.5 rounded-xl text-sm block ${
                            rec.score >= 8 
                              ? 'bg-emerald-100 text-emerald-800' 
                              : rec.score >= 5 
                              ? 'bg-blue-100 text-blue-800' 
                              : 'bg-rose-100 text-rose-800'
                          }`}>
                            {rec.score} / 10
                          </span>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className="p-4 bg-slate-50 border-t border-slate-200 text-right">
                  <button
                    onClick={() => setShowHistoryModal(false)}
                    className="px-5 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold"
                  >
                    Đóng
                  </button>
                </div>
              </div>
            </div>
          )}

          {showUpgradeModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-md w-full overflow-hidden p-6 space-y-4">
                <div className="text-center space-y-2">
                  <div className="w-14 h-14 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-1">
                    <Award className="w-7 h-7 text-amber-600" />
                  </div>
                  <h3 className="text-xl font-bold text-slate-900">Nâng Cấp Tài Khoản VIP</h3>
                  <p className="text-xs text-slate-500">Mở khóa toàn bộ đặc quyền học tập chỉ với 100.000đ/năm học!</p>
                </div>

                <ul className="space-y-2 bg-amber-50 p-3.5 rounded-xl border border-amber-200 text-xs text-amber-900">
                  <li className="flex items-start gap-2">
                    <CheckCircle className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />
                    <span><b>Xem lại lịch sử kết quả đã làm</b> và thống kê điểm số cá nhân.</span>
                  </li>
                  <li className="flex items-start gap-2">
                    <CheckCircle className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />
                    <span><b>Xem đáp án đúng/sai</b> ngay sau khi nộp bài.</span>
                  </li>
                  <li className="flex items-start gap-2">
                    <CheckCircle className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />
                    <span>Xem <b>Lời giải chi tiết</b> cho tất cả các câu hỏi.</span>
                  </li>
                  <li className="flex items-start gap-2">
                    <CheckCircle className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />
                    <span>Quyền <b>Tải Đề Thi dạng file PDF</b> về máy hoặc in ấn.</span>
                  </li>
                </ul>

                <div className="flex gap-3 pt-2">
                  <button
                    onClick={() => setShowUpgradeModal(false)}
                    className="flex-1 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all"
                  >
                    Để sau
                  </button>
                  <button
                    onClick={() => {
                      setShowUpgradeModal(false);
                      setShowQrModal(true);
                    }}
                    className="flex-[2] px-4 py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white rounded-xl text-xs font-bold shadow-md transition-all flex items-center justify-center gap-2"
                  >
                    <Sparkles className="w-4 h-4" /> Thanh Toán QR Code
                  </button>
                </div>
              </div>
            </div>
          )}

          {showQrModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-md w-full overflow-hidden p-6 space-y-4 text-center">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <Award className="w-5 h-5 text-amber-600" />
                    <h3 className="font-bold text-slate-900 text-base">Quét Mã QR Chuyển Khoản VIP</h3>
                  </div>
                  <button onClick={() => setShowQrModal(false)} className="text-slate-400 hover:text-slate-700">
                    <XCircle className="w-6 h-6" />
                  </button>
                </div>

                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex flex-col items-center space-y-3">
                  <div className="w-56 h-56 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-center">
                    <img 
                      src={`https://img.vietqr.io/image/MB-0906481485-compact2.png?amount=100000&addInfo=${encodeURIComponent(`VIP ${currentStudent?.name} ${currentStudent?.phone}`)}&accountName=TRAN%20VIET%20HANH`} 
                      alt="VietQR Code" 
                      className="w-full h-full object-contain rounded-xl"
                    />
                  </div>

                  <div>
                    <div className="text-2xl font-extrabold text-blue-600">100.000đ</div>
                    <div className="text-xs font-bold text-slate-600 mt-0.5">Nội dung CK: <span className="text-indigo-600 font-mono">VIP {currentStudent?.name} {currentStudent?.phone}</span></div>
                    <div className="text-xs font-extrabold text-slate-900 tracking-wider mt-1 uppercase">Ngân hàng MB • TRAN VIET HANH</div>
                  </div>

                  <p className="text-[11px] text-slate-500 leading-relaxed">
                    Sau khi quét mã và hoàn tất chuyển khoản ngân hàng, hãy bấm gửi yêu cầu dưới đây để giáo viên xác thực và duyệt VIP.
                  </p>
                </div>

                <div className="flex gap-3 pt-1">
                  <button
                    onClick={() => setShowQrModal(false)}
                    className="flex-1 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all"
                  >
                    Đóng
                  </button>
                  <button
                    onClick={() => {
                      onRequestVip(currentStudent.phone);
                      setShowQrModal(false);
                    }}
                    className="flex-[2] px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition-all flex items-center justify-center gap-1.5"
                  >
                    <CheckCircle className="w-4 h-4 text-yellow-300" />
                    <span>Tôi đã chuyển tiền - Gửi yêu cầu duyệt</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ActiveCTMQuizTaking({
      quiz,
      currentStudent,
      userAnswers,
      setUserAnswers,
      timeLeft,
      quizSubmitted,
      scoreResult,
      handleFinishQuiz,
      exitQuiz,
      showToast
    }) {
      const [aiExplanation, setAiExplanation] = useState({});
      const [isExplaining, setIsExplaining] = useState({});
      const [viewMode, setViewMode] = useState('single');
      const [currentQIndex, setCurrentQIndex] = useState(0);

      const flatQuestions = React.useMemo(() => {
        const flat = [];
        (quiz.part1 || []).forEach((q, idx) => flat.push({ part: 1, localIndex: idx, data: q, globalIndex: flat.length }));
        (quiz.part2 || []).forEach((q, idx) => flat.push({ part: 2, localIndex: idx, data: q, globalIndex: flat.length }));
        (quiz.part3 || []).forEach((q, idx) => flat.push({ part: 3, localIndex: idx, data: q, globalIndex: flat.length }));
        return flat;
      }, [quiz]);

      const currentItem = flatQuestions[currentQIndex];

      const isQuestionAnswered = (item) => {
        if (item.part === 1) return userAnswers[`p1_${item.localIndex}`] !== undefined;
        if (item.part === 2) {
          return (item.data.statements || []).every((_, sIdx) => userAnswers[`p2_${item.localIndex}_${sIdx}`] !== undefined);
        }
        if (item.part === 3) return userAnswers[`p3_${item.localIndex}`] !== undefined && userAnswers[`p3_${item.localIndex}`] !== '';
        return false;
      };

      const isQuestionCorrect = (item) => {
        if (!quizSubmitted) return false;
        if (item.part === 1) return userAnswers[`p1_${item.localIndex}`] === item.data.correctAnswer;
        if (item.part === 2) {
          return (item.data.statements || []).every((s, sIdx) => userAnswers[`p2_${item.localIndex}_${sIdx}`] === s.isTrue);
        }
        if (item.part === 3) return parseInt(userAnswers[`p3_${item.localIndex}`]) === parseInt(item.data.correctAnswer);
        return false;
      };

      const handleExplainWrongAnswer = async (questionText, studentAnswer, correctAnswer, key) => {
        setIsExplaining(prev => ({...prev, [key]: true}));
        const prompt = `Học sinh vừa làm sai một câu hỏi Toán THPT.
        Nội dung câu hỏi: ${questionText}
        Học sinh chọn/nhập đáp án: ${studentAnswer}
        Đáp án đúng của chương trình là: ${correctAnswer}
        
        Hãy đóng vai gia sư, giải thích ngắn gọn, thân thiện (dưới 4 câu) vì sao học sinh có thể đã nhầm lẫn khi chọn đáp án đó, và hướng dẫn sơ lược cách tư duy để ra đáp án đúng. Sử dụng LaTeX $...$ cho các công thức.`;
        
        try {
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            const res = await callGeminiAPI(payload);
            setAiExplanation(prev => ({...prev, [key]: res?.candidates?.[0]?.content?.parts?.[0]?.text || "Gia sư AI hiện đang bận, em thử lại sau nhé."}));
        } catch(e) {
            setAiExplanation(prev => ({...prev, [key]: "Lỗi kết nối AI."}));
        } finally {
            setIsExplaining(prev => ({...prev, [key]: false}));
        }
      };

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto pb-12">
          <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex items-center justify-between sticky top-20 z-30">
            <div className="flex items-center space-x-3">
              <button
                onClick={exitQuiz}
                className="p-2 text-slate-500 hover:bg-slate-100 rounded-xl transition-all"
                title="Thoát"
              >
                <ArrowLeft className="w-5 h-5" />
              </button>
              <div>
                <h2 className="font-bold text-slate-900 text-sm md:text-base">{quiz.title}</h2>
                <p className="text-xs text-slate-500">Khối {quiz.grade} • Cấu trúc 2025 (3 Phần)</p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <button
                onClick={() => {
                  if (currentStudent?.isPremium) {
                    window.print();
                  } else {
                    if (showToast) showToast('Tính năng Tải/In file PDF đề thi chỉ dành cho tài khoản VIP!', 'info');
                  }
                }}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs md:text-sm font-bold border transition-all ${currentStudent?.isPremium ? 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100' : 'bg-slate-100 text-slate-400 border-slate-200'}`}
                title="Tải PDF Đề Thi"
              >
                {currentStudent?.isPremium ? <Download className="w-4 h-4" /> : <Lock className="w-4 h-4" />}
                <span className="hidden sm:inline">Xuất PDF</span>
              </button>

              {!quizSubmitted ? (
                <div className={`flex items-center space-x-2 px-3 py-1.5 rounded-xl border text-xs md:text-sm font-bold ${
                  timeLeft < 180 ? 'bg-rose-50 text-rose-600 border-rose-200 animate-pulse' : 'bg-indigo-50 text-indigo-700 border-indigo-200'
                }`}>
                  <Clock className="w-4 h-4" />
                  <span>{formatTime(timeLeft)}</span>
                </div>
              ) : (
                <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1">
                  <CheckCircle className="w-4 h-4" /> Đã Hoàn Thành
                </span>
              )}

              {!quizSubmitted && (
                <button
                  onClick={() => handleFinishQuiz(false)}
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition-all"
                >
                  Nộp Bài
                </button>
              )}
            </div>
          </div>

          {quizSubmitted && scoreResult && (
            <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white rounded-2xl p-6 shadow-md flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-4">
                <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-md shrink-0">
                  <Award className="w-10 h-10 text-yellow-300" />
                </div>
                <div>
                  <h3 className="text-xl font-bold">Kết Quả Bài Làm Của Bạn</h3>
                  <p className="text-xs text-emerald-100 mt-1">
                    Số điểm thành phần đã đạt: <strong>{scoreResult.correctCount} / {scoreResult.totalQuestions} phần</strong>
                  </p>
                </div>
              </div>

              <div className="text-center md:text-right bg-white/10 p-3 px-6 rounded-2xl border border-white/20">
                <span className="text-xs font-medium uppercase tracking-wider text-emerald-100 block">Tổng Điểm</span>
                <span className="text-3xl font-extrabold text-yellow-300">{scoreResult.score} / 10</span>
              </div>
            </div>
          )}

          <div className="flex justify-center mt-2">
            <div className="flex bg-slate-200/70 p-1 rounded-xl w-fit border border-slate-200 shadow-inner">
              <button
                onClick={() => setViewMode('single')}
                className={`flex items-center space-x-2 px-5 py-2 text-sm font-bold rounded-lg transition-all ${viewMode === 'single' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
              >
                <Layers className="w-4 h-4" />
                <span>Hiển thị từng câu</span>
              </button>
              <button
                onClick={() => setViewMode('all')}
                className={`flex items-center space-x-2 px-5 py-2 text-sm font-bold rounded-lg transition-all ${viewMode === 'all' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
              >
                <FileText className="w-4 h-4" />
                <span>Hiển thị toàn đề</span>
              </button>
            </div>
          </div>

          {viewMode === 'all' ? (
            <div className="space-y-6">
              {/* PART 1 */}
              <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                <div className="bg-indigo-50 p-3 rounded-xl border-l-4 border-indigo-600 font-bold text-indigo-950 text-xs flex justify-between items-center">
                  <span>PHẦN I. Câu hỏi trắc nghiệm nhiều phương án lựa chọn (Thí sinh trả lời từ câu 1 đến câu 10)</span>
                  <span className="bg-indigo-200 text-indigo-800 px-2 py-0.5 rounded font-bold">{quiz.part1?.length || 0} Câu</span>
                </div>

                <div className="space-y-6">
                  {(quiz.part1 || []).map((q, idx) => {
                    const selectedVal = userAnswers[`p1_${idx}`];
                    const isCorrect = selectedVal === q.correctAnswer;
                    const isWrongSelect = quizSubmitted && selectedVal && !isCorrect;

                    return (
                      <div key={idx} className="p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-3">
                        <div className="font-bold text-slate-900 text-sm leading-relaxed">
                          <span>Câu {idx + 1}: </span><MathText text={q.question} />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          {(q.options || []).map((opt, oIdx) => {
                            const letter = String.fromCharCode(65 + oIdx);
                            const isOptSelected = selectedVal === letter;
                            const isOptCorrect = q.correctAnswer === letter;

                            let btnStyle = "bg-white border-slate-200 hover:bg-slate-100";
                            if (quizSubmitted) {
                              if (currentStudent?.isPremium) {
                                if (isOptCorrect) btnStyle = "bg-emerald-50 border-emerald-500 font-bold text-emerald-950 ring-1 ring-emerald-500";
                                else if (isOptSelected && !isOptCorrect) btnStyle = "bg-rose-50 border-rose-400 text-rose-950";
                                else btnStyle = "border-slate-200 opacity-60";
                              } else if (isOptSelected) {
                                btnStyle = "bg-slate-200 border-slate-400 text-slate-800 font-bold";
                              }
                            } else if (isOptSelected) {
                              btnStyle = "bg-indigo-50 border-indigo-500 font-bold text-indigo-950 ring-2 ring-indigo-500/20";
                            }

                            return (
                              <button
                                key={oIdx}
                                type="button"
                                disabled={quizSubmitted}
                                onClick={() => setUserAnswers(prev => ({...prev, [`p1_${idx}`]: letter}))}
                                className={`p-3 rounded-xl border text-left text-xs transition flex items-start space-x-2.5 ${btnStyle}`}
                              >
                                <span className={`w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center shrink-0 border ${isOptSelected ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-100 border-slate-300 text-slate-700'}`}>
                                  {letter}
                                </span>
                                <div className="flex-1 pt-0.5"><MathText text={opt} /></div>
                                {quizSubmitted && isOptCorrect && currentStudent?.isPremium && <CheckCircle className="w-5 h-5 text-emerald-600 shrink-0" />}
                                {quizSubmitted && isOptSelected && !isOptCorrect && currentStudent?.isPremium && <XCircle className="w-5 h-5 text-rose-500 shrink-0" />}
                              </button>
                            );
                          })}
                        </div>

                        {quizSubmitted && isWrongSelect && currentStudent?.isPremium && (
                          <div className="pt-2">
                            <button
                              onClick={() => handleExplainWrongAnswer(q.question, selectedVal, q.correctAnswer, `p1_${idx}`)}
                              disabled={isExplaining[`p1_${idx}`]}
                              className="text-purple-700 hover:text-purple-900 text-xs font-bold flex items-center gap-1.5 transition-all"
                            >
                              <Bot className="w-4 h-4" />
                              {isExplaining[`p1_${idx}`] ? 'Gia sư AI đang giải thích...' : 'Hỏi Gia Sư AI vì sao em chọn sai?'}
                            </button>
                            {aiExplanation[`p1_${idx}`] && (
                              <div className="mt-2 p-3 bg-purple-50 border border-purple-200 rounded-xl text-purple-900 text-xs leading-relaxed">
                                <MathText text={aiExplanation[`p1_${idx}`]} />
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* PART 2 */}
              <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                <div className="bg-emerald-50 p-3 rounded-xl border-l-4 border-emerald-600 font-bold text-emerald-950 text-xs flex justify-between items-center">
                  <span>PHẦN II. Câu hỏi trắc nghiệm đúng sai (Mỗi câu gồm 4 ý a, b, c, d)</span>
                  <span className="bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded font-bold">{quiz.part2?.length || 0} Câu</span>
                </div>

                <div className="space-y-6">
                  {(quiz.part2 || []).map((q, idx) => (
                    <div key={idx} className="p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-3">
                      <div className="font-bold text-slate-900 text-sm leading-relaxed">
                        <span>Câu {idx + 1}: </span><MathText text={q.question} />
                      </div>

                      <div className="space-y-2">
                        {(q.statements || []).map((stmt, sIdx) => {
                          const key = `p2_${idx}_${sIdx}`;
                          const ans = userAnswers[key];
                          const isCorrect = ans === stmt.isTrue;

                          return (
                            <div key={sIdx} className="p-3 bg-white border border-slate-200 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-sm">
                              <div className="flex items-start space-x-2 flex-1">
                                <span className="font-bold text-indigo-700 shrink-0">{stmt.label})</span>
                                <div className="text-slate-800"><MathText text={stmt.text} /></div>
                              </div>

                              <div className="flex items-center space-x-3 shrink-0">
                                <label className={`flex items-center space-x-1 px-4 py-2 rounded-xl border-2 cursor-pointer font-bold transition ${
                                  ans === true ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                }`}>
                                  <input
                                    type="radio"
                                    name={key}
                                    disabled={quizSubmitted}
                                    checked={ans === true}
                                    onChange={() => setUserAnswers(prev => ({...prev, [key]: true}))}
                                    className="hidden"
                                  />
                                  <span>Đúng</span>
                                </label>

                                <label className={`flex items-center space-x-1 px-4 py-2 rounded-xl border-2 cursor-pointer font-bold transition ${
                                  ans === false ? 'bg-rose-600 text-white border-rose-600 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                }`}>
                                  <input
                                    type="radio"
                                    name={key}
                                    disabled={quizSubmitted}
                                    checked={ans === false}
                                    onChange={() => setUserAnswers(prev => ({...prev, [key]: false}))}
                                    className="hidden"
                                  />
                                  <span>Sai</span>
                                </label>

                                {quizSubmitted && currentStudent?.isPremium && (
                                  <span className={`font-bold px-3 py-1.5 rounded-lg text-[11px] uppercase tracking-wide flex items-center gap-1 ${stmt.isTrue ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                    {isCorrect ? <CheckCircle className="w-3.5 h-3.5" /> : <XCircle className="w-3.5 h-3.5" />}
                                    Thực tế: {stmt.isTrue ? 'Đúng' : 'Sai'}
                                  </span>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* PART 3 */}
              <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                <div className="bg-amber-50 p-3 rounded-xl border-l-4 border-amber-600 font-bold text-amber-950 text-xs flex justify-between items-center">
                  <span>PHẦN III. Câu hỏi trắc nghiệm trả lời ngắn (Đáp số là số nguyên hoặc thập phân)</span>
                  <span className="bg-amber-200 text-amber-900 px-2 py-0.5 rounded font-bold">{quiz.part3?.length || 0} Câu</span>
                </div>

                <div className="space-y-6">
                  {(quiz.part3 || []).map((q, idx) => {
                    const key = `p3_${idx}`;
                    const ans = userAnswers[key] || '';
                    const isCorrect = quizSubmitted && parseFloat(ans) === parseFloat(q.correctAnswer);

                    return (
                      <div key={idx} className="p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-3">
                        <div className="font-bold text-slate-900 text-sm leading-relaxed">
                          <span>Câu {idx + 1}: </span><MathText text={q.question} />
                        </div>

                        <div className="flex flex-col sm:flex-row sm:items-center gap-3">
                          <input
                            type="number"
                            disabled={quizSubmitted}
                            placeholder="Nhập đáp số..."
                            value={ans}
                            onChange={(e) => setUserAnswers(prev => ({...prev, [key]: e.target.value}))}
                            className="w-full sm:w-64 bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner"
                          />
                          {quizSubmitted && currentStudent?.isPremium && (
                            <div className="flex items-center space-x-2">
                              <span className={`text-sm font-bold px-4 py-3 rounded-xl flex items-center gap-2 ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                {isCorrect ? (
                                  <><CheckCircle className="w-5 h-5" /> <span>Chính xác!</span></>
                                ) : (
                                  <><XCircle className="w-5 h-5" /> <span>Sai. Đáp án: {q.correctAnswer}</span></>
                                )}
                              </span>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {quizSubmitted && !currentStudent?.isPremium && (
                <div className="p-6 bg-slate-800 rounded-2xl text-center text-white space-y-3 mt-6">
                  <Lock className="w-10 h-10 text-amber-400 mx-auto" />
                  <h3 className="font-bold text-lg">Khóa Xem Lời Giải & Đáp Án</h3>
                  <p className="text-sm text-slate-300">Tài khoản của bạn hiện là tài khoản thường. Hãy Nâng cấp VIP ở màn hình chính để được đối chiếu đáp án đúng và xuất file PDF đề thi.</p>
                </div>
              )}
            </div>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
              <div className="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6 flex flex-col justify-between">
                {currentItem && (
                  <>
                    <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                      <div className="flex items-center space-x-3">
                        <span className={`text-xs font-bold px-3 py-1.5 rounded-lg text-white ${currentItem.part === 1 ? 'bg-indigo-600' : currentItem.part === 2 ? 'bg-emerald-600' : 'bg-amber-600'}`}>
                          PHẦN {currentItem.part === 1 ? 'I' : currentItem.part === 2 ? 'II' : 'III'}
                        </span>
                        <span className="font-bold text-slate-700 text-sm">
                          Câu {currentItem.localIndex + 1}
                        </span>
                      </div>
                      <span className="text-xs text-slate-400 font-medium bg-slate-50 px-2.5 py-1 rounded-md border border-slate-200">
                        {currentQIndex + 1} / {flatQuestions.length}
                      </span>
                    </div>

                    {currentItem.part === 1 && (() => {
                      const idx = currentItem.localIndex;
                      const q = currentItem.data;
                      const selectedVal = userAnswers[`p1_${idx}`];
                      const isCorrect = selectedVal === q.correctAnswer;
                      const isWrongSelect = quizSubmitted && selectedVal && !isCorrect;

                      return (
                        <div className="space-y-4 flex-1">
                          <div className="font-bold text-slate-900 text-base leading-relaxed">
                            <MathText text={q.question} />
                          </div>
                          <div className="grid grid-cols-1 gap-3 mt-4">
                            {(q.options || []).map((opt, oIdx) => {
                              const letter = String.fromCharCode(65 + oIdx);
                              const isOptSelected = selectedVal === letter;
                              const isOptCorrect = q.correctAnswer === letter;

                              let btnStyle = "bg-white border-slate-200 hover:bg-slate-100";
                              if (quizSubmitted) {
                                if (currentStudent?.isPremium) {
                                  if (isOptCorrect) btnStyle = "bg-emerald-50 border-emerald-500 font-bold text-emerald-900 ring-1 ring-emerald-500";
                                  else if (isOptSelected && !isOptCorrect) btnStyle = "bg-rose-50 border-rose-400 text-rose-900";
                                  else btnStyle = "border-slate-200 opacity-60";
                                } else if (isOptSelected) {
                                  btnStyle = "bg-slate-100 border-slate-400 text-slate-700 font-bold";
                                }
                              } else if (isOptSelected) {
                                btnStyle = "bg-indigo-50 border-indigo-600 font-bold text-indigo-950 ring-2 ring-indigo-500/20";
                              }

                              return (
                                <button
                                  key={oIdx}
                                  type="button"
                                  disabled={quizSubmitted}
                                  onClick={() => setUserAnswers(prev => ({...prev, [`p1_${idx}`]: letter}))}
                                  className={`w-full p-4 rounded-xl border text-left text-sm transition-all flex items-start space-x-3 ${btnStyle}`}
                                >
                                  <span className={`w-7 h-7 rounded-full border text-sm font-bold flex items-center justify-center shrink-0 ${isOptSelected ? 'bg-indigo-600 text-white border-indigo-600' : 'border-slate-300 text-slate-600 bg-slate-50'}`}>
                                    {letter}
                                  </span>
                                  <div className="flex-1 pt-0.5"><MathText text={opt} /></div>
                                  {quizSubmitted && isOptCorrect && currentStudent?.isPremium && <CheckCircle className="w-6 h-6 text-emerald-600 shrink-0" />}
                                  {quizSubmitted && isOptSelected && !isOptCorrect && currentStudent?.isPremium && <XCircle className="w-6 h-6 text-rose-500 shrink-0" />}
                                </button>
                              );
                            })}
                          </div>
                          {quizSubmitted && isWrongSelect && currentStudent?.isPremium && (
                            <div className="pt-4">
                              <button
                                onClick={() => handleExplainWrongAnswer(q.question, selectedVal, q.correctAnswer, `p1_${idx}`)}
                                disabled={isExplaining[`p1_${idx}`]}
                                className="text-purple-700 hover:text-purple-900 text-sm font-bold flex items-center gap-1.5 transition-all"
                              >
                                <Bot className="w-5 h-5" />
                                {isExplaining[`p1_${idx}`] ? 'Gia sư AI đang giải thích...' : 'Hỏi Gia Sư AI vì sao em chọn sai?'}
                              </button>
                              {aiExplanation[`p1_${idx}`] && (
                                <div className="mt-3 p-4 bg-purple-50 border border-purple-200 rounded-xl text-purple-900 text-sm leading-relaxed">
                                  <MathText text={aiExplanation[`p1_${idx}`]} />
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })()}

                    {currentItem.part === 2 && (() => {
                      const idx = currentItem.localIndex;
                      const q = currentItem.data;
                      return (
                        <div className="space-y-6 flex-1">
                          <div className="font-bold text-slate-900 text-base leading-relaxed">
                            <MathText text={q.question} />
                          </div>
                          <div className="space-y-3">
                            {(q.statements || []).map((stmt, sIdx) => {
                              const key = `p2_${idx}_${sIdx}`;
                              const ans = userAnswers[key];
                              const isCorrect = ans === stmt.isTrue;

                              return (
                                <div key={sIdx} className="p-4 bg-white border border-slate-200 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-4 text-sm">
                                  <div className="flex items-start space-x-2 flex-1">
                                    <span className="font-bold text-emerald-700 shrink-0">{stmt.label})</span>
                                    <div className="text-slate-800 leading-relaxed"><MathText text={stmt.text} /></div>
                                  </div>

                                  <div className="flex items-center space-x-3 shrink-0">
                                    <label className={`flex items-center space-x-1 px-5 py-2.5 rounded-xl border-2 cursor-pointer font-bold transition ${
                                      ans === true ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                    }`}>
                                      <input type="radio" name={key} disabled={quizSubmitted} checked={ans === true} onChange={() => setUserAnswers(prev => ({...prev, [key]: true}))} className="hidden" />
                                      <span>Đúng</span>
                                    </label>

                                    <label className={`flex items-center space-x-1 px-5 py-2.5 rounded-xl border-2 cursor-pointer font-bold transition ${
                                      ans === false ? 'bg-rose-600 text-white border-rose-600 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                    }`}>
                                      <input type="radio" name={key} disabled={quizSubmitted} checked={ans === false} onChange={() => setUserAnswers(prev => ({...prev, [key]: false}))} className="hidden" />
                                      <span>Sai</span>
                                    </label>

                                    {quizSubmitted && currentStudent?.isPremium && (
                                      <span className={`font-bold px-3 py-2 rounded-lg text-xs uppercase tracking-wide flex items-center gap-1.5 ${stmt.isTrue ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                        {isCorrect ? <CheckCircle className="w-4 h-4" /> : <XCircle className="w-4 h-4" />}
                                        TT: {stmt.isTrue ? 'Đúng' : 'Sai'}
                                      </span>
                                    )}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })()}

                    {currentItem.part === 3 && (() => {
                      const idx = currentItem.localIndex;
                      const q = currentItem.data;
                      const key = `p3_${idx}`;
                      const ans = userAnswers[key] || '';
                      const isCorrect = quizSubmitted && parseFloat(ans) === parseFloat(q.correctAnswer);

                      return (
                        <div className="space-y-6 flex-1">
                          <div className="font-bold text-slate-900 text-base leading-relaxed">
                            <MathText text={q.question} />
                          </div>
                          <div className="flex flex-col sm:flex-row sm:items-center gap-4">
                            <input
                              type="number"
                              disabled={quizSubmitted}
                              placeholder="Nhập đáp số..."
                              value={ans}
                              onChange={(e) => setUserAnswers(prev => ({...prev, [key]: e.target.value}))}
                              className="w-full sm:w-72 bg-slate-50 border-2 border-slate-300 rounded-xl px-5 py-4 text-base font-bold focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 shadow-inner"
                            />
                            {quizSubmitted && currentStudent?.isPremium && (
                              <div className="flex items-center space-x-2">
                                <span className={`text-sm font-bold px-5 py-4 rounded-xl flex items-center gap-2 ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                  {isCorrect ? (
                                    <><CheckCircle className="w-6 h-6" /> <span>Chính xác!</span></>
                                  ) : (
                                    <><XCircle className="w-6 h-6" /> <span>Sai. Đáp án: {q.correctAnswer}</span></>
                                  )}
                                </span>
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })()}

                    {quizSubmitted && !currentStudent?.isPremium && (
                      <div className="mt-6 p-5 bg-slate-800 rounded-xl text-center text-white space-y-2 border border-slate-700">
                        <Lock className="w-8 h-8 text-amber-400 mx-auto" />
                        <h3 className="font-bold text-sm">Khóa Xem Kết Quả Chi Tiết</h3>
                        <p className="text-xs text-slate-300">Tính năng này yêu cầu tài khoản VIP. Bạn chỉ xem được điểm tổng kết phía trên.</p>
                      </div>
                    )}

                    <div className="pt-6 mt-4 border-t border-slate-100 flex items-center justify-between">
                      <button
                        onClick={() => setCurrentQIndex(prev => Math.max(0, prev - 1))}
                        disabled={currentQIndex === 0}
                        className="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-sm font-semibold hover:bg-slate-50 disabled:opacity-40 transition"
                      >
                        Câu Trước
                      </button>

                      {currentQIndex < flatQuestions.length - 1 ? (
                        <button
                          onClick={() => setCurrentQIndex(prev => Math.min(flatQuestions.length - 1, prev + 1))}
                          className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm transition"
                        >
                          Câu Tiếp Theo
                        </button>
                      ) : !quizSubmitted ? (
                        <button
                          onClick={() => handleFinishQuiz(false)}
                          className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold shadow-md transition"
                        >
                          Nộp Bài Thi
                        </button>
                      ) : null}
                    </div>
                  </>
                )}
              </div>

              <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-5 h-fit lg:sticky lg:top-40">
                <h4 className="font-bold text-slate-800 text-sm pb-2 border-b border-slate-100 flex items-center gap-2">
                  <Layers className="w-4 h-4 text-indigo-500" />
                  Sơ Đồ Câu Hỏi ({flatQuestions.length})
                </h4>

                <div className="max-h-[55vh] overflow-y-auto pr-1 space-y-5">
                  {[1, 2, 3].map(partNum => {
                    const partItems = flatQuestions.filter(item => item.part === partNum);
                    if (partItems.length === 0) return null;

                    let titleColor = "text-indigo-700";
                    let titleBg = "bg-indigo-50";
                    let partTitle = "PHẦN I";

                    if (partNum === 2) {
                        titleColor = "text-emerald-700";
                        titleBg = "bg-emerald-50";
                        partTitle = "PHẦN II";
                    } else if (partNum === 3) {
                        titleColor = "text-amber-700";
                        titleBg = "bg-amber-50";
                        partTitle = "PHẦN III";
                    }

                    return (
                      <div key={partNum}>
                        <div className={`text-[10px] font-bold ${titleColor} ${titleBg} px-2.5 py-1 rounded-md mb-2.5 inline-block uppercase tracking-wider`}>
                          {partTitle}
                        </div>
                        <div className="grid grid-cols-5 gap-2">
                          {partItems.map((item) => {
                            const globalIdx = item.globalIndex;
                            const isAnswered = isQuestionAnswered(item);
                            const isCurrent = globalIdx === currentQIndex;
                            let btnBg = "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";

                            if (quizSubmitted) {
                              if (currentStudent?.isPremium) {
                                btnBg = isQuestionCorrect(item) ? "bg-emerald-500 text-white border-emerald-600" : "bg-rose-500 text-white border-rose-600";
                              } else if (isAnswered) {
                                btnBg = "bg-slate-400 text-white border-slate-500";
                              }
                            } else if (isAnswered) {
                              btnBg = "bg-indigo-600 text-white font-bold border-indigo-700";
                            }

                            return (
                              <button
                                key={globalIdx}
                                onClick={() => setCurrentQIndex(globalIdx)}
                                className={`h-10 rounded-lg font-bold text-xs transition-all flex items-center justify-center border shadow-sm ${btnBg} ${
                                  isCurrent ? 'ring-2 ring-offset-2 ring-indigo-500 scale-105' : ''
                                }`}
                                title={`Phần ${partNum} - Câu ${item.localIndex + 1}`}
                              >
                                {item.localIndex + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="space-y-2.5 pt-4 border-t border-slate-100 text-xs text-slate-600 font-medium">
                  <div className="flex items-center space-x-2">
                    <span className="w-3.5 h-3.5 bg-indigo-600 rounded-sm shadow-sm" />
                    <span>Đã trả lời</span>
                  </div>
                  <div className="flex items-center space-x-2">
                    <span className="w-3.5 h-3.5 bg-slate-100 border border-slate-300 rounded-sm" />
                    <span>Chưa làm</span>
                  </div>
                  {quizSubmitted && currentStudent?.isPremium && (
                    <>
                      <div className="flex items-center space-x-2">
                        <span className="w-3.5 h-3.5 bg-emerald-500 rounded-sm shadow-sm" />
                        <span>Chính xác tuyệt đối</span>
                      </div>
                      <div className="flex items-center space-x-2">
                        <span className="w-3.5 h-3.5 bg-rose-500 rounded-sm shadow-sm" />
                        <span>Sai / Có ý sai</span>
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ActiveQuizTaking({
      quiz,
      currentStudent,
      userAnswers,
      setUserAnswers,
      flaggedQuestions,
      setFlaggedQuestions,
      timeLeft,
      quizSubmitted,
      scoreResult,
      handleFinishQuiz,
      exitQuiz,
      showToast
    }) {
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const currentQ = quiz.questions[currentQIndex];

      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const audioRef = useRef(null);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      const selectAnswer = (qId, optionIdx) => {
        if (quizSubmitted) return;
        setUserAnswers(prev => ({ ...prev, [qId]: optionIdx }));
      };

      const toggleFlag = (qId) => {
        if (quizSubmitted) return;
        setFlaggedQuestions(prev => ({ ...prev, [qId]: !prev[qId] }));
      };

      const handlePlayAudioSolution = async () => {
        if (isPlayingAudio) {
          if (audioRef.current) audioRef.current.pause();
          setIsPlayingAudio(false);
          return;
        }

        setIsPlayingAudio(true);
        try {
          const textToSpeak = `Câu hỏi: ${currentQ.question.replace(/\$/g, '')}. Đáp án đúng là đáp án ${String.fromCharCode(65 + currentQ.correct)}. Lời giải chi tiết: ${currentQ.explanation.replace(/\$/g, '')}`;
          const url = await callGeminiTTS(textToSpeak);
          
          if (audioRef.current) {
            audioRef.current.src = url;
            audioRef.current.play();
          }
        } catch (err) {
          setIsPlayingAudio(false);
        }
      };

      return (
        <div className="space-y-6">
          <audio ref={audioRef} onEnded={() => setIsPlayingAudio(false)} className="hidden" />

          <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-wrap items-center justify-between gap-4 sticky top-20 z-30">
            <div className="flex items-center space-x-3">
              <button
                onClick={exitQuiz}
                className="p-2 text-slate-500 hover:bg-slate-100 rounded-xl transition-all"
                title="Thoát danh sách đề"
              >
                <ArrowLeft className="w-5 h-5" />
              </button>
              <div>
                <h2 className="font-bold text-slate-900 text-base">{quiz.title}</h2>
                <p className="text-xs text-slate-500">Khối {quiz.grade} • {quiz.questions.length} câu hỏi</p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <button
                onClick={() => {
                  if (currentStudent?.isPremium) {
                    window.print();
                  } else {
                    if (showToast) showToast('Tính năng Tải/In file PDF đề thi chỉ dành cho tài khoản VIP!', 'info');
                  }
                }}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs md:text-sm font-bold border transition-all ${currentStudent?.isPremium ? 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100' : 'bg-slate-100 text-slate-400 border-slate-200'}`}
                title="Tải PDF Đề Thi"
              >
                {currentStudent?.isPremium ? <Download className="w-4 h-4" /> : <Lock className="w-4 h-4" />}
                <span className="hidden sm:inline">Xuất PDF</span>
              </button>

              {!quizSubmitted ? (
                <div className={`flex items-center space-x-2 px-3 py-1.5 rounded-xl border text-sm font-bold ${
                  timeLeft < 180 ? 'bg-rose-50 text-rose-600 border-rose-200 animate-pulse' : 'bg-indigo-50 text-indigo-700 border-indigo-200'
                }`}>
                  <Clock className="w-4 h-4" />
                  <span>{formatTime(timeLeft)}</span>
                </div>
              ) : (
                <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1">
                  <CheckCircle className="w-4 h-4" />
                  Đã Hoàn Thành
                </span>
              )}

              {!quizSubmitted && (
                <button
                  onClick={() => handleFinishQuiz(false)}
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition-all"
                >
                  Nộp Bài
                </button>
              )}
            </div>
          </div>

          {quizSubmitted && scoreResult && (
            <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white rounded-2xl p-6 shadow-md flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-4">
                <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-md shrink-0">
                  <Award className="w-10 h-10 text-yellow-300" />
                </div>
                <div>
                  <h3 className="text-xl font-bold">Kết Quả Bài Làm Của Bạn</h3>
                  <p className="text-xs text-emerald-100 mt-1">
                    Số câu đúng: <strong>{scoreResult.correctCount} / {scoreResult.totalQuestions} câu</strong>
                  </p>
                </div>
              </div>

              <div className="text-center md:text-right bg-white/10 p-3 px-6 rounded-2xl border border-white/20">
                <span className="text-xs font-medium uppercase tracking-wider text-emerald-100 block">Điểm Số</span>
                <span className="text-3xl font-extrabold text-yellow-300">{scoreResult.score} / 10</span>
              </div>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div className="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <span className="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-lg">
                      Câu {currentQIndex + 1} / {quiz.questions.length}
                    </span>
                    {flaggedQuestions[currentQ.id] && (
                      <span className="bg-amber-100 text-amber-800 text-xs font-semibold px-2 py-0.5 rounded-md flex items-center gap-1">
                        <Bookmark className="w-3 h-3 fill-amber-600" />
                        Đã xem lại
                      </span>
                    )}
                  </div>

                  {!quizSubmitted && (
                    <button
                      onClick={() => toggleFlag(currentQ.id)}
                      className={`text-xs font-medium flex items-center space-x-1 px-2.5 py-1 rounded-lg transition-all ${
                        flaggedQuestions[currentQ.id]
                          ? 'bg-amber-100 text-amber-800 font-semibold'
                          : 'text-slate-500 hover:bg-slate-100'
                      }`}
                    >
                      <Bookmark className="w-3.5 h-3.5" />
                      <span>{flaggedQuestions[currentQ.id] ? 'Bỏ đánh dấu' : 'Đánh dấu câu này'}</span>
                    </button>
                  )}
                </div>

                <div className="py-4 text-slate-900 font-medium text-base leading-relaxed">
                  <MathText text={currentQ.question} />
                </div>

                <div className="space-y-3 mt-2">
                  {currentQ.options.map((optionText, optIdx) => {
                    const isSelected = userAnswers[currentQ.id] === optIdx;
                    const isCorrect = currentQ.correct === optIdx;

                    let stateStyle = "border-slate-200 hover:border-indigo-300 hover:bg-slate-50";

                    if (quizSubmitted) {
                      if (currentStudent?.isPremium) {
                        if (isCorrect) {
                          stateStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold ring-1 ring-emerald-500";
                        } else if (isSelected && !isCorrect) {
                          stateStyle = "bg-rose-50 border-rose-400 text-rose-900";
                        } else {
                          stateStyle = "border-slate-200 opacity-60";
                        }
                      } else {
                        if (isSelected) {
                          stateStyle = "bg-slate-100 border-slate-400 text-slate-700 font-semibold";
                        }
                      }
                    } else if (isSelected) {
                      stateStyle = "bg-indigo-50 border-indigo-600 text-indigo-950 font-semibold ring-2 ring-indigo-500/20";
                    }

                    return (
                      <button
                        key={optIdx}
                        onClick={() => selectAnswer(currentQ.id, optIdx)}
                        disabled={quizSubmitted}
                        className={`w-full p-4 rounded-xl border text-left text-sm transition-all flex items-start space-x-3 ${stateStyle}`}
                      >
                        <span className={`w-6 h-6 rounded-full border text-xs font-bold flex items-center justify-center shrink-0 ${
                          isSelected 
                            ? 'bg-indigo-600 text-white border-indigo-600' 
                            : 'border-slate-300 text-slate-600'
                        }`}>
                          {String.fromCharCode(65 + optIdx)}
                        </span>

                        <div className="flex-1 pt-0.5">
                          <MathText text={optionText} />
                        </div>

                        {quizSubmitted && currentStudent?.isPremium && isCorrect && (
                          <CheckCircle className="w-5 h-5 text-emerald-600 shrink-0" />
                        )}
                        {quizSubmitted && currentStudent?.isPremium && isSelected && !isCorrect && (
                          <XCircle className="w-5 h-5 text-rose-500 shrink-0" />
                        )}
                      </button>
                    );
                  })}
                </div>

                {quizSubmitted && currentStudent?.isPremium && (
                  <div className="mt-6 p-4 bg-amber-50 rounded-xl border border-amber-200 text-xs space-y-3">
                    <div className="flex items-center justify-between border-b border-amber-200 pb-2">
                      <div className="font-bold text-amber-900 flex items-center gap-1">
                        <HelpCircle className="w-4 h-4 text-amber-700" />
                        <span>Lời giải chi tiết SGK:</span>
                      </div>

                      <button
                        onClick={handlePlayAudioSolution}
                        className="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-bold flex items-center gap-1 transition-all text-[11px]"
                      >
                        <Volume2 className="w-3.5 h-3.5" />
                        <span>{isPlayingAudio ? 'Dừng Đọc AI' : '🔊 Nghe AI Đọc Lời Giải'}</span>
                      </button>
                    </div>

                    <div className="text-slate-800 leading-relaxed pl-2">
                      <MathText text={currentQ.explanation || 'Không có giải thích.'} />
                    </div>
                  </div>
                )}
                
                {quizSubmitted && !currentStudent?.isPremium && (
                  <div className="mt-6 p-4 bg-slate-800 rounded-xl text-center text-white space-y-2">
                    <Lock className="w-6 h-6 text-amber-400 mx-auto" />
                    <h3 className="font-bold text-sm">Tính năng giới hạn cho tài khoản Thường</h3>
                    <p className="text-xs text-slate-300">Vui lòng nâng cấp tài khoản VIP ở trang chủ để xem đáp án đúng, lời giải chi tiết và tính năng in ấn.</p>
                  </div>
                )}
              </div>

              <div className="pt-6 border-t border-slate-100 flex items-center justify-between">
                <button
                  onClick={() => setCurrentQIndex(prev => Math.max(0, prev - 1))}
                  disabled={currentQIndex === 0}
                  className="px-4 py-2 rounded-xl border border-slate-200 text-slate-700 text-xs font-semibold hover:bg-slate-50 disabled:opacity-40"
                >
                  Câu Trước
                </button>

                {currentQIndex < quiz.questions.length - 1 ? (
                  <button
                    onClick={() => setCurrentQIndex(prev => Math.min(quiz.questions.length - 1, prev + 1))}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm"
                  >
                    Câu Tiếp Theo
                  </button>
                ) : !quizSubmitted ? (
                  <button
                    onClick={() => handleFinishQuiz(false)}
                    className="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm"
                  >
                    Nộp Bài Thi
                  </button>
                ) : null}
              </div>
            </div>

            <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-5 h-fit">
              <h4 className="font-bold text-slate-800 text-sm pb-2 border-b border-slate-100">
                Sơ Đồ Câu Hỏi ({quiz.questions.length})
              </h4>

              <div className="grid grid-cols-5 gap-2">
                {quiz.questions.map((q, idx) => {
                  const isAnswered = userAnswers[q.id] !== undefined;
                  const isFlagged = flaggedQuestions[q.id];
                  const isCurrent = idx === currentQIndex;

                  let btnBg = "bg-slate-100 text-slate-700 border-slate-200";

                  if (quizSubmitted) {
                    const isCorrect = userAnswers[q.id] === q.correct;
                    if (currentStudent?.isPremium) {
                      btnBg = isCorrect ? "bg-emerald-500 text-white" : "bg-rose-500 text-white";
                    } else if (isAnswered) {
                      btnBg = "bg-slate-400 text-white";
                    }
                  } else if (isAnswered) {
                    btnBg = "bg-indigo-600 text-white font-bold";
                  }

                  return (
                    <button
                      key={q.id}
                      onClick={() => setCurrentQIndex(idx)}
                      className={`h-9 rounded-lg font-semibold text-xs transition-all relative flex items-center justify-center border ${btnBg} ${
                        isCurrent ? 'ring-2 ring-offset-1 ring-indigo-500' : ''
                      }`}
                    >
                      {idx + 1}
                      {isFlagged && !quizSubmitted && (
                        <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-400 rounded-full border border-white" />
                      )}
                    </button>
                  );
                })}
              </div>

              <div className="space-y-2 pt-3 border-t border-slate-100 text-[11px] text-slate-500">
                <div className="flex items-center space-x-2">
                  <span className="w-3 h-3 bg-indigo-600 rounded-sm" />
                  <span>Đã chọn đáp án</span>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="w-3 h-3 bg-slate-100 border border-slate-300 rounded-sm" />
                  <span>Chưa làm</span>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="w-3 h-3 bg-amber-400 rounded-sm" />
                  <span>Đánh dấu xem lại</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function QuizFormBuilder({ editingQuiz, onSave, onExportSingleQuiz, onCancel, showToast }) {
      const [grade, setGrade] = useState(editingQuiz ? editingQuiz.grade : '12');
      const [title, setTitle] = useState(editingQuiz ? editingQuiz.title : '');
      const [duration, setDuration] = useState(editingQuiz ? editingQuiz.duration : 15);
      const [description, setDescription] = useState(editingQuiz ? editingQuiz.description : '');

      const [aiTopic, setAiTopic] = useState('');
      const [aiQuestionCount, setAiQuestionCount] = useState(3);
      const [isAiGenerating, setIsAiGenerating] = useState(false);

      const [showPdfModal, setShowPdfModal] = useState(false);
      const [isProcessingPdf, setIsProcessingPdf] = useState(false);
