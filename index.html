    const callGeminiAPI = async (payload, retries = 3) => {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      
      let delay = 1000;
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) {
            throw new Error(`Gemini API Error: Status ${response.status}`);
          }
          const result = await response.json();
          return result;
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(res => setTimeout(res, delay));
          delay *= 2;
        }
      }
    };

    const callGeminiTTS = async (textToSpeak) => {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
      
      const payload = {
        contents: [{
          parts: [{ text: `Hãy đọc diễn cảm bằng tiếng Việt đoạn lời giải Toán THPT sau đây một cách rõ ràng và truyền cảm: ${textToSpeak}` }]
        }],
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: {
            voiceConfig: {
              prebuiltVoiceConfig: { voiceName: "Kore" }
            }
          }
        },
        model: "gemini-2.5-flash-preview-tts"
      };

      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();
      const part = result?.candidates?.[0]?.content?.parts?.[0];
      const audioData = part?.inlineData?.data;
      const mimeType = part?.inlineData?.mimeType;

      if (audioData && mimeType && mimeType.startsWith("audio/")) {
        const sampleRateMatch = mimeType.match(/rate=(\d+)/);
        const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
        
        const binaryStr = atob(audioData);
        const len = binaryStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        const pcm16 = new Int16Array(bytes.buffer);
        
        const numChannels = 1;
        const byteRate = sampleRate * numChannels * 2;
        const blockAlign = numChannels * 2;
        const wavBuffer = new ArrayBuffer(44 + pcm16.length * 2);
        const view = new DataView(wavBuffer);

        const writeString = (view, offset, string) => {
          for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
          }
        };

        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + pcm16.length * 2, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, 'data');
        view.setUint32(40, pcm16.length * 2, true);

        for (let i = 0; i < pcm16.length; i++) {
          view.setInt16(44 + i * 2, pcm16[i], true);
        }

        const wavBlob = new Blob([wavBuffer], { type: 'audio/wav' });
        return URL.createObjectURL(wavBlob);
      }
      throw new Error("Không nhận được dữ liệu âm thanh từ Gemini TTS API.");
    };

    const MathText = ({ text }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !text) return;

        if (window.katex) {
          const parts = text.split(/(\$[^$]+\$)/g);
          containerRef.current.innerHTML = '';
          
          parts.forEach(part => {
            if (part.startsWith('$') && part.endsWith('$') && part.length > 2) {
              const mathExpr = part.slice(1, -1);
              const span = document.createElement('span');
              try {
                window.katex.render(mathExpr, span, { throwOnError: false });
                containerRef.current.appendChild(span);
              } catch (e) {
                span.textContent = part;
                containerRef.current.appendChild(span);
              }
            } else {
              const span = document.createElement('span');
              span.textContent = part;
              containerRef.current.appendChild(span);
            }
          });
        } else {
          containerRef.current.textContent = text;
        }
      }, [text]);

      return <span ref={containerRef} className="inline-wrap" />;
    };

            correctAnswer: 'A'
          }
        ],
        part2: [
          {
            question: 'Cho hàm số $y = x^3 - 3x^2 + 2$. Các phát biểu sau đúng hay sai?',
            statements: [
              { label: 'a', text: 'Hàm số có đạo hàm $y\' = 3x^2 - 6x$.', isTrue: true },
              { label: 'b', text: 'Hàm số đạt cực đại tại $x = 0$.', isTrue: true },
              { label: 'c', text: 'Giá trị cực tiểu của hàm số bằng $2$.', isTrue: false },
              { label: 'd', text: 'Đồ thị hàm số nhận điểm $I(1; 0)$ làm tâm đối xứng.', isTrue: true }
            ]
          }
        ],
        part3: [
          {
            question: 'Tìm giá trị nhỏ nhất $m$ của hàm số $y = x^3 - 3x + 5$ trên đoạn $[0; 2]$.',
            correctAnswer: '3'
          }
        ],
        questions: []
      },
      {
        id: 'q11-dai-1',
        grade: '11',
        title: 'ĐỀ ÔN TẬP HÀM SỐ LƯỢNG GIÁC & DÃY SỐ (KHỐI 11)',
        duration: 45,
        description: 'Đề kiểm tra trắc nghiệm 12 câu tập trung vào phương trình lượng giác và cấp số nhân.',
        isCTM2025: false,
        questions: [
          {
            id: 'q11_1',
            question: 'Nghiệm của phương trình $\\sin x = \\frac{1}{2}$ là:',
            options: [
              '$x = \\frac{\\pi}{6} + k2\\pi, x = \\frac{5\\pi}{6} + k2\\pi$',
              '$x = \\frac{\\pi}{3} + k2\\pi$',
              '$x = \\frac{\\pi}{4} + k\\pi$',
              '$x = \\pm \\frac{\\pi}{6} + k2\\pi$'
            ],
            correct: 0,
            explanation: 'Phương trình $\\sin x = \\sin \\left(\\frac{\\pi}{6}\\right)$ có nghiệm $x = \\frac{\\pi}{6} + k2\\pi$ và $x = \\pi - \\frac{\\pi}{6} + k2\\pi = \\frac{5\\pi}{6} + k2\\pi$.'
          },
          {
            id: 'q11_2',
            question: 'Cho cấp số nhân $(u_n)$ có số hạng đầu $u_1 = 2$ và công bội $q = 3$. Số hạng thứ 4 là:',
            options: ['$u_4 = 18$', '$u_4 = 54$', '$u_4 = 27$', '$u_4 = 162$'],
            correct: 1,
            explanation: 'Công thức số hạng tổng quát: $u_n = u_1 \\cdot q^{n-1}$. Do đó $u_4 = u_1 \\cdot q^3 = 2 \\cdot 3^3 = 2 \\cdot 27 = 54$.'
          }
        ]
      },
      {
        id: 'q10-hinh-1',
        grade: '10',
        title: 'ĐỀ ÔN TẬP VEC-TƠ & HỆ THỨC LƯỢNG TRONG TAM GIÁC (KHỐI 10)',
        duration: 45,
        description: 'Đề kiểm tra bám sát chương trình mới Toán 10.',
        isCTM2025: false,
        questions: [
          {
            id: 'q10_1',
            question: 'Cho tam giác $ABC$ có các cạnh $a, b, c$. Công thức tính diện tích $S$ nào sau đây đúng?',
            options: [
              '$S = \\frac{1}{2}bc \\sin A$',
              '$S = \\frac{1}{2}ab \\cos C$',
              '$S = bc \\sin A$',
              '$S = \\frac{1}{4}abc$'
            ],
            correct: 0,
            explanation: 'Diện tích tam giác tính theo hai cạnh và góc xen giữa là $S = \\frac{1}{2}bc \\sin A = \\frac{1}{2}ac \\sin B = \\frac{1}{2}ab \\sin C$.'
          }
        ]
      }
    ];

    const INITIAL_STUDENTS = [
      { phone: '0901234567', password: '123', name: 'Trần Viết Huy Khang', grade: '10', isPremium: true, pendingVip: false },
      { phone: '0912345678', password: '123', name: 'Trần Viết Quý Khang', grade: '11', isPremium: false, pendingVip: false },
      { phone: '0987654321', password: '123', name: 'Trần Viết Hanh', grade: '12', isPremium: true, pendingVip: false }
    ];

    const INITIAL_HISTORY = [
      {
        id: 'sub-1',
        studentName: 'Trần Viết Huy Khang',
        grade: '12',
        quizTitle: 'ĐỀ THI ÔN TẬP TOÁN THPT 2025 (Cấu Trúc Mới)',
        score: 9.5,
        totalQuestions: 3,
        correctCount: 3,
        submittedAt: '14:20 - 02/08/2026'
      }
    ];

    function App() {
      const [role, setRole] = useState('student');
      const [studentGrade, setStudentGrade] = useState('12');

      const [isTeacherLoggedIn, setIsTeacherLoggedIn] = useState(() => {
        try {
          return localStorage.getItem('edumath_teacher_auth') === 'true';
        } catch (e) {
          return false;
        }
      });
      const [showTeacherModal, setShowTeacherModal] = useState(false);

      const [quizzes, setQuizzes] = useState(INITIAL_QUIZZES);
      const [registeredStudents, setRegisteredStudents] = useState(INITIAL_STUDENTS);
      const [currentStudent, setCurrentStudent] = useState(null);
      const [submissionHistory, setSubmissionHistory] = useState(INITIAL_HISTORY);
      const [isFirebaseSynced, setIsFirebaseSynced] = useState(false);

      useEffect(() => {
        const initFirebaseCloud = async () => {
          try {
            if (!window.firebaseModules || typeof __firebase_config === 'undefined') return;
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, collection, onSnapshot } = window.firebaseModules;
            
            const firebaseConfig = JSON.parse(__firebase_config);
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-edumath-thpt';

            // Sync Quizzes
            const qRef = collection(db, 'artifacts', appId, 'public', 'data', 'quizzes');
            onSnapshot(qRef, (snapshot) => {
              if (!snapshot.empty) {
                const cloudQuizzes = [];
                snapshot.forEach(docSnap => cloudQuizzes.push({ id: docSnap.id, ...docSnap.data() }));
                if (cloudQuizzes.length > 0) setQuizzes(cloudQuizzes);
              } else {
                INITIAL_QUIZZES.forEach(async (q) => {
                  await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'quizzes', q.id), q);
                });
              }
            }, (err) => console.log("Quiz sync err:", err));

            // Sync Students
            const sRef = collection(db, 'artifacts', appId, 'public', 'data', 'students');
            onSnapshot(sRef, (snapshot) => {
              if (!snapshot.empty) {
                const cloudStudents = [];
                snapshot.forEach(docSnap => cloudStudents.push({ ...docSnap.data() }));
                if (cloudStudents.length > 0) setRegisteredStudents(cloudStudents);
              } else {
                INITIAL_STUDENTS.forEach(async (st) => {
                  await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'students', st.phone), st);
                });
              }
            }, (err) => console.log("Student sync err:", err));

            // Sync History
            const hRef = collection(db, 'artifacts', appId, 'public', 'data', 'history');
            onSnapshot(hRef, (snapshot) => {
              if (!snapshot.empty) {
                const cloudHistory = [];
                snapshot.forEach(docSnap => cloudHistory.push({ id: docSnap.id, ...docSnap.data() }));
                if (cloudHistory.length > 0) setSubmissionHistory(cloudHistory);
              }
            }, (err) => console.log("History sync err:", err));

            setIsFirebaseSynced(true);
          } catch (e) {
            console.log("Firebase init fallback to local:", e);
          }
        };

        initFirebaseCloud();
      }, []);

      const saveToCloud = async (collectionName, docId, data) => {
        try {
          if (window.firebaseModules && typeof __firebase_config !== 'undefined') {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-edumath-thpt';
            const db = window.firebaseModules.getFirestore();
            await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId), data, { merge: true });
          }
        } catch (e) {}
      };

      const deleteFromCloud = async (collectionName, docId) => {
        try {
          if (window.firebaseModules && typeof __firebase_config !== 'undefined') {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-edumath-thpt';
            const db = window.firebaseModules.getFirestore();
            await window.firebaseModules.deleteDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId));
          }
        } catch (e) {}
      };

      useEffect(() => {
        if (currentStudent && registeredStudents) {
          const latestMe = registeredStudents.find(s => s.phone === currentStudent.phone);
          if (latestMe) {
            setCurrentStudent(latestMe);
          }
        }
      }, [registeredStudents]);

      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleTeacherLogin = (phone, password) => {
        if (phone === '0906481485' && password === '13572468@') {
          setIsTeacherLoggedIn(true);
          try {
            localStorage.setItem('edumath_teacher_auth', 'true');
          } catch (e) {}
          setRole('teacher');
          setShowTeacherModal(false);
          setStudentActiveQuiz(null);
          showToast('Xác thực Giáo viên thành công!', 'success');
          return true;
        } else {
          showToast('Số điện thoại hoặc mật khẩu Giáo viên không chính xác!', 'info');
          return false;
        }
      };

      const handleTeacherLogout = () => {
        setIsTeacherLoggedIn(false);
        try {
          localStorage.removeItem('edumath_teacher_auth');
        } catch (e) {}
        setRole('student');
        showToast('Đã đăng xuất khỏi quyền Giáo viên.', 'info');
      };

      const [teacherActiveTab, setTeacherActiveTab] = useState('quizzes');
      const [selectedGradeFilter, setSelectedGradeFilter] = useState('all');
      const [editingQuiz, setEditingQuiz] = useState(null);

      const [studentActiveQuiz, setStudentActiveQuiz] = useState(null);
      const [userAnswers, setUserAnswers] = useState({});
      const [flaggedQuestions, setFlaggedQuestions] = useState({});
      const [timeLeft, setTimeLeft] = useState(0);
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [studentScoreResult, setStudentScoreResult] = useState(null);

      useEffect(() => {
        let timer;
        if (studentActiveQuiz && !quizSubmitted && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 1) {
                clearInterval(timer);
                handleFinishQuiz(true);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [studentActiveQuiz, quizSubmitted, timeLeft]);

      const handleResetData = () => {
        setRegisteredStudents(INITIAL_STUDENTS);
        setQuizzes(INITIAL_QUIZZES);
        setSubmissionHistory(INITIAL_HISTORY);
        setCurrentStudent(null);
        setStudentActiveQuiz(null);
        showToast('Đã khôi phục dữ liệu ban đầu!', 'info');
      };

      const handleStudentLogin = (phone, password) => {
        const student = registeredStudents.find(s => s.phone === phone && s.password === password);
        if (student) {
          setCurrentStudent(student);
          setStudentGrade(student.grade);
          showToast(`Đăng nhập thành công! Chào mừng ${student.name}`, 'success');
          return true;
        } else {
          showToast('Số điện thoại hoặc mật khẩu không chính xác!', 'info');
          return false;
        }
      };

      const handleStudentRegister = (name, phone, password, grade) => {
        const existing = registeredStudents.find(s => s.phone === phone);
        if (existing) {
          showToast('Số điện thoại này đã được đăng ký từ trước!', 'info');
          return false;
        }

        const newStudent = { name, phone, password, grade, isPremium: false, pendingVip: false };
        setRegisteredStudents(prev => [newStudent, ...prev]);
        setCurrentStudent(newStudent);
        setStudentGrade(grade);
        saveToCloud('students', phone, newStudent);
        showToast(`Đã tạo và lưu tự động tài khoản Cloud cho ${name}!`, 'success');
        return true;
      };

      const handleStudentLogout = () => {
        setCurrentStudent(null);
        setStudentActiveQuiz(null);
        showToast('Đã đăng xuất khỏi tài khoản học sinh.', 'info');
      };

      const handleRequestVip = (phone) => {
        const updated = registeredStudents.map(s => s.phone === phone ? { ...s, pendingVip: true } : s);
        setRegisteredStudents(updated);
        const target = updated.find(s => s.phone === phone);
        if (target) saveToCloud('students', phone, target);
        setCurrentStudent(prev => ({ ...prev, pendingVip: true }));
        showToast('Đã gửi yêu cầu kích hoạt VIP lên Cloud! Vui lòng chờ giáo viên duyệt.', 'success');
      };

      const handleApproveVip = (phone) => {
        const updated = registeredStudents.map(s => s.phone === phone ? { ...s, isPremium: true, pendingVip: false } : s);
        setRegisteredStudents(updated);
        const target = updated.find(s => s.phone === phone);
        if (target) saveToCloud('students', phone, target);
        showToast(`Đã phê duyệt VIP trên Cloud cho học sinh SĐT ${phone}!`, 'success');
      };

      const handleRejectVip = (phone) => {
        const updated = registeredStudents.map(s => s.phone === phone ? { ...s, pendingVip: false } : s);
        setRegisteredStudents(updated);
        const target = updated.find(s => s.phone === phone);
        if (target) saveToCloud('students', phone, target);
        showToast(`Đã từ chối yêu cầu VIP của SĐT ${phone}.`, 'info');
      };

      const handleUpdateStudentProfile = (newName, newGrade, newPassword) => {
        if (!currentStudent) return;
        const updatedStudent = {
          ...currentStudent,
          name: newName,
          grade: newGrade,
          password: newPassword
        };
        setCurrentStudent(updatedStudent);
        setRegisteredStudents(prev => prev.map(s => s.phone === currentStudent.phone ? updatedStudent : s));
        saveToCloud('students', currentStudent.phone, updatedStudent);
        setStudentGrade(newGrade);
        showToast('Cập nhật thông tin cá nhân lên Cloud thành công!', 'success');
      };

      const handleFinishQuiz = (isAutoSubmit = false) => {
        if (!studentActiveQuiz) return;
        
        let correct = 0;
        let total = 0;
        let scoreVal = 0;

        if (studentActiveQuiz.isCTM2025) {
            total = 15; 
            let totalScore = 0;
            
            (studentActiveQuiz.part1 || []).forEach((q, idx) => {
                if (userAnswers[`p1_${idx}`] === q.correctAnswer) {
                    totalScore += 0.5;
                    correct += 1;
                }
            });

            (studentActiveQuiz.part2 || []).forEach((q, idx) => {
                let sCorrect = 0;
                (q.statements || []).forEach((s, sIdx) => {
                    const ans = userAnswers[`p2_${idx}_${sIdx}`];
                    if (ans !== undefined && ans === s.isTrue) sCorrect++;
                });
                if (sCorrect === 1) totalScore += 0.2;
                else if (sCorrect === 2) totalScore += 0.5;
                else if (sCorrect === 3) totalScore += 1.0;
                else if (sCorrect === 4) { totalScore += 2.0; correct += 1; }
            });

            (studentActiveQuiz.part3 || []).forEach((q, idx) => {
                const ans = userAnswers[`p3_${idx}`];
                if (ans !== undefined && parseInt(ans) === parseInt(q.correctAnswer)) {
                    totalScore += (1/3);
                    correct += 1;
                }
            });

            scoreVal = Math.min(10, Math.round(totalScore * 10) / 10).toFixed(1);
        } else {
            studentActiveQuiz.questions.forEach((q) => {
              if (userAnswers[q.id] === q.correct) {
                correct += 1;
              }
            });
            total = studentActiveQuiz.questions.length;
            scoreVal = total > 0 ? ((correct / total) * 10).toFixed(1) : 0;
        }

        const resultObj = {
          score: parseFloat(scoreVal),
          correctCount: correct,
          totalQuestions: total,
          answers: { ...userAnswers },
          autoSubmitted: isAutoSubmit
        };

        setStudentScoreResult(resultObj);
        setQuizSubmitted(true);

        const newRecordId = 'sub-' + Date.now();
        const newRecord = {
          id: newRecordId,
          studentPhone: currentStudent ? currentStudent.phone : '',
          studentName: currentStudent ? currentStudent.name : `Học sinh Khối ${studentGrade}`,
          grade: studentGrade,
          quizTitle: studentActiveQuiz.title,
          score: parseFloat(scoreVal),
          totalQuestions: total,
          correctCount: correct,
          submittedAt: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' - ' + new Date().toLocaleDateString('vi-VN')
        };

        setSubmissionHistory(prev => [newRecord, ...prev]);
        saveToCloud('history', newRecordId, newRecord);
        showToast(isAutoSubmit ? 'Hết giờ! Bài làm đã tự động nộp lên Cloud.' : 'Đã nộp bài lên Cloud thành công!', 'success');
      };

      const startQuiz = (quiz) => {
        setStudentActiveQuiz(quiz);
        setUserAnswers({});
        setFlaggedQuestions({});
        setTimeLeft(quiz.duration * 60);
        setQuizSubmitted(false);
        setStudentScoreResult(null);
      };

      const exitQuiz = () => {
        setStudentActiveQuiz(null);
        setQuizSubmitted(false);
        setStudentScoreResult(null);
      };

      const handleDeleteQuiz = (id) => {
        const updated = quizzes.filter(q => q.id !== id);
        setQuizzes(updated);
        deleteFromCloud('quizzes', id);
        showToast('Đã xóa bài tập khỏi Cloud!', 'info');
      };

      const handleSaveQuiz = (newQuiz) => {
        let updatedQuizzes;
        if (editingQuiz) {
          updatedQuizzes = quizzes.map(q => q.id === newQuiz.id ? newQuiz : q);
          showToast(`Cập nhật thành công đề thi Khối ${newQuiz.grade} lên Cloud!`, 'success');
        } else {
          updatedQuizzes = [newQuiz, ...quizzes];
          showToast(`Đã đăng & lưu thành công đề thi Khối ${newQuiz.grade} lên Cloud!`, 'success');
        }
        setQuizzes(updatedQuizzes);
        saveToCloud('quizzes', newQuiz.id, newQuiz);
        setTeacherActiveTab('quizzes');
        setSelectedGradeFilter(newQuiz.grade);
        setEditingQuiz(null);
      };

      const handleImportQuizFile = (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        let loadedCount = 0;
        let allImportedList = [];

        Array.from(files).forEach((file) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const importedData = JSON.parse(event.target.result);
              let importedList = [];

              if (Array.isArray(importedData)) {
                importedList = importedData;
              } else if (importedData && importedData.title) {
                importedList = [importedData];
              }

              const formattedList = importedList.map(q => ({
                ...q,
                id: q.id ? q.id : 'q' + (q.grade || '12') + '-' + Date.now() + Math.random().toString(36).substr(2, 4)
              }));

              allImportedList.push(...formattedList);
            } catch (err) {}

            loadedCount++;
            if (loadedCount === files.length) {
              if (allImportedList.length > 0) {
                setQuizzes(prev => {
                  const existingIds = new Set(prev.map(p => p.id));
                  const newQuizzes = allImportedList.filter(f => !existingIds.has(f.id));
                  const updated = [...newQuizzes, ...prev];
                  updated.forEach(q => saveToCloud('quizzes', q.id, q));
                  return updated;
                });
                showToast(`Đã tải lên & lưu thành công ${allImportedList.length} đề thi lên Cloud Firestore!`, 'success');
              } else {
                showToast('Không tìm thấy file đề thi JSON hợp lệ.', 'info');
              }
              e.target.value = '';
            }
          };
          reader.readAsText(file);
        });
      };

      const handleExportSingleQuiz = (quiz) => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quiz, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `DeThi_Khoi${quiz.grade}_${quiz.id}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast(`Đã lưu file đề "${quiz.title}" về máy thành công!`, 'success');
      };

      const handleExportAllQuizzes = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quizzes, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `EduMath_TatCaDeThi_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast(`Đã xuất toàn bộ ${quizzes.length} đề thi thành công!`, 'success');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">
          <header className="bg-gradient-to-r from-blue-700 via-indigo-700 to-indigo-800 text-white shadow-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-white/10 p-2 rounded-xl backdrop-blur-md border border-white/20">
                  <GraduationCap className="w-6 h-6 text-yellow-300" />
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight flex items-center gap-2">
                    EduMath THPT
                    <span className="text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-semibold flex items-center gap-1 shadow-sm">
                      <Database className="w-2.5 h-2.5" /> {isFirebaseSynced ? 'Cloud Firebase Active' : 'Auto-Sync Active'} ({registeredStudents.length} HS)
                    </span>
                  </h1>
                  <p className="text-xs text-blue-200 hidden sm:block">Cổng thông tin & Luyện tập trắc nghiệm THPT</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <div className="flex items-center space-x-1 bg-indigo-950/40 p-1 rounded-xl border border-indigo-400/30">
                  <button
                    onClick={() => {
                      setRole('student');
                      setStudentActiveQuiz(null);
                    }}
                    className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${
                      role === 'student'
                        ? 'bg-white text-indigo-900 shadow-sm font-semibold'
                        : 'text-blue-100 hover:text-white hover:bg-white/10'
                    }`}
                  >
                    <User className="w-4 h-4" />

    function TeacherView({
      quizzes,
      activeTab,
      setActiveTab,
      selectedGradeFilter,
      setSelectedGradeFilter,
      onDeleteQuiz,
      onSaveQuiz,
      onExportSingleQuiz,
      onExportAllQuizzes,
      onImportQuizFile,
      editingQuiz,
      setEditingQuiz,
      submissionHistory,
      registeredStudents,
      setRegisteredStudents,
      onApproveVip,
      onRejectVip,
      onTeacherLogout,
      showToast
    }) {
      const filteredQuizzes = quizzes.filter(q => 
        selectedGradeFilter === 'all' ? true : q.grade === selectedGradeFilter
      );

      const [editingStudent, setEditingStudent] = useState(null);
      const [newPasswordVal, setNewPasswordVal] = useState('');
      const [searchStudentQuery, setSearchStudentQuery] = useState('');

      const [aiAnalysis, setAiAnalysis] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      const handleAnalyzeResults = async () => {
        if (submissionHistory.length === 0) {
          if (showToast) showToast('Chưa có dữ liệu học sinh nộp bài để phân tích!', 'info');
          return;
        }
        
        setIsAnalyzing(true);
        const stats = submissionHistory.map(s => `- Học sinh ${s.studentName} (Khối ${s.grade}): Đạt ${s.score}/10 điểm (Đề: ${s.quizTitle})`).join('\n');
        
        const prompt = `Bạn là một chuyên gia phân tích dữ liệu giáo dục và cố vấn học tập. 
        Dưới đây là thống kê điểm số các bài kiểm tra gần đây của học sinh:
        ${stats}
        
        Hãy viết một đoạn phân tích ngắn gọn (khoảng 3-4 câu) đánh giá tình hình học tập chung của lớp, phổ điểm hiện tại, và đưa ra một lời khuyên thiết thực cho giáo viên để cải thiện kết quả. Không dùng markdown in đậm quá nhiều.`;
        
        try {
          const payload = { contents: [{ parts: [{ text: prompt }] }] };
          const res = await callGeminiAPI(payload);
          setAiAnalysis(res?.candidates?.[0]?.content?.parts?.[0]?.text || "Xin lỗi, không thể phân tích dữ liệu lúc này.");
        } catch (err) {
          setAiAnalysis("Đã xảy ra lỗi khi kết nối với AI để phân tích.");
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleUpdateStudentPassword = (studentPhone) => {
        if (!newPasswordVal.trim()) return;
        setRegisteredStudents(prev => prev.map(s => {
          if (s.phone === studentPhone) {
            return { ...s, password: newPasswordVal.trim() };
          }
          return s;
        }));
        setEditingStudent(null);
        setNewPasswordVal('');
        if (showToast) showToast('Cập nhật mật khẩu học sinh thành công!', 'success');
      };

      const handleDeleteStudent = (studentPhone) => {
        if (window.confirm(`Bạn có chắc chắn muốn xóa tài khoản có SĐT ${studentPhone}?`)) {
          setRegisteredStudents(prev => prev.filter(s => s.phone !== studentPhone));
          if (showToast) showToast('Đã xóa tài khoản học sinh!', 'info');
        }
      };

      const handleExportStudentsCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFFSTT,Họ Tên,Khối,Số Điện Thoại,Mật Khẩu,Loại Tài Khoản\n";
        registeredStudents.forEach((st, idx) => {
          csvContent += `${idx + 1},="${st.name}",="Khối ${st.grade}",="${st.phone}",="${st.password}",="${st.isPremium ? 'VIP' : 'Thường'}"\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `DanhSachHocSinh_EduMath_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        link.remove();
        if (showToast) showToast('Đã xuất file danh sách học sinh (định dạng SĐT chuẩn Text) thành công!', 'success');
      };

      const handleExportHistoryCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFFSTT,Học Sinh,Khối,Tên Đề Thi,Số Câu Đúng,Điểm Số,Thời Gian Nộp\n";
        submissionHistory.forEach((sub, idx) => {
          csvContent += `${idx + 1},="${sub.studentName}",="Khối ${sub.grade}",="${sub.quizTitle}",="${sub.correctCount}/${sub.totalQuestions}",="${sub.score}",="${sub.submittedAt}"\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `LichSuNopBai_EduMath_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        link.remove();
        if (showToast) showToast('Đã xuất file lịch sử nộp bài thành công!', 'success');
      };

      const handleImportStudentsCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const text = event.target.result;
            const cleanText = text.replace(/^\uFEFF/, '');
            const lines = cleanText.split('\n').filter(line => line.trim() !== '');
            
            if (lines.length <= 1) {
              if (showToast) showToast('File CSV trống hoặc không đúng định dạng.', 'info');
              return;
            }

            const newStudents = [];
            
            for (let i = 1; i < lines.length; i++) {
              const line = lines[i];
              const row = [];
              let insideQuote = false;
              let currentWord = '';
              
              for (let char of line) {
                if (char === '"') {
                  insideQuote = !insideQuote;
                } else if (char === ',' && !insideQuote) {
                  row.push(currentWord.trim());
                  currentWord = '';
                } else {
                  currentWord += char;
                }
              }
              row.push(currentWord.trim());

              if (row.length >= 6) {
                 const cleanVal = (val) => val ? val.replace(/^="?|"?$/g, '').replace(/^"|"$/g, '') : '';
                 let name = cleanVal(row[1]);
                 let gradeRaw = cleanVal(row[2]);
                 let phone = cleanVal(row[3]);
                 let password = cleanVal(row[4]);
                 let type = cleanVal(row[5]);

                 let grade = gradeRaw.replace('Khối ', '');
                 let isPremium = type === 'VIP';

                 if (phone && name && password) {
                   newStudents.push({ name, phone, password, grade, isPremium });
                 }
              }
            }

            if (newStudents.length > 0) {
              setRegisteredStudents(prev => {
                const existingPhones = new Map(prev.map(s => [s.phone, s]));
                newStudents.forEach(s => {
                  existingPhones.set(s.phone, s);
                });
                return Array.from(existingPhones.values());
              });
              if (showToast) showToast(`Đã tải lên và cập nhật ${newStudents.length} tài khoản học sinh!`, 'success');
            } else {
               if (showToast) showToast('Không tìm thấy dữ liệu học sinh hợp lệ.', 'info');
            }
          } catch (err) {
            if (showToast) showToast('Lỗi khi đọc file CSV!', 'info');
          }
          e.target.value = '';
        };
        reader.readAsText(file);
      };

      const filteredStudentsList = (registeredStudents || []).filter(s => 
        s.name.toLowerCase().includes(searchStudentQuery.toLowerCase()) ||
        s.phone.includes(searchStudentQuery)
      );

      const pendingVipList = (registeredStudents || []).filter(s => s.pendingVip);

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="p-2.5 bg-amber-50 rounded-xl text-amber-700">
                <Award className="w-6 h-6" />
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <h2 className="font-bold text-slate-900 text-lg">Quản Lý Đề Thi & Bài Tập THPT</h2>
                  <span className="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2 py-0.5 rounded-md flex items-center gap-1">
                    <ShieldCheck className="w-3 h-3" /> 0906481485
                  </span>
                </div>
                <p className="text-xs text-slate-500">Giao diện soạn đề trắc nghiệm Toán & Quản lý danh sách Học sinh</p>
              </div>
            </div>

            <div className="flex items-center space-x-2 flex-wrap">
              <div className="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl">
                <button
                  onClick={() => setActiveTab('quizzes')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                    activeTab === 'quizzes' 
                      ? 'bg-white text-indigo-700 shadow-sm' 
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  Danh Sách Đề ({quizzes.length})
                </button>

                <button
                  onClick={() => {
                    setEditingQuiz(null);
                    setActiveTab('create');
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1 ${
                    activeTab === 'create' 
                      ? 'bg-indigo-600 text-white shadow-sm' 
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <PlusCircle className="w-3.5 h-3.5" />
                  <span>Tạo Đề Mới</span>
                </button>

                <button
                  onClick={() => {
                    setEditingQuiz(null);
                    setActiveTab('ctm');
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1 ${
                    activeTab === 'ctm' 
                      ? 'bg-purple-600 text-white shadow-sm' 
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Sparkles className="w-3.5 h-3.5 text-yellow-300" />
                  <span>Tạo đề theo CTM</span>
                </button>

                <button
                  onClick={() => setActiveTab('students')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all relative ${
                    activeTab === 'students' 
                      ? 'bg-white text-indigo-700 shadow-sm' 
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <span>Quản Lý Học Sinh ({registeredStudents ? registeredStudents.length : 0})</span>
                  {pendingVipList.length > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold animate-pulse">
                      {pendingVipList.length}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setActiveTab('results')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1 ${
                    activeTab === 'results' 
                      ? 'bg-white text-indigo-700 shadow-sm' 
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <BarChart2 className="w-3.5 h-3.5" />
                  <span>Thống Kê Điểm ({submissionHistory.length})</span>
                </button>
              </div>

              <button
                onClick={onTeacherLogout}
                className="p-2 text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-xl transition-all"
                title="Đăng xuất khỏi quyền Giáo viên"
              >
                <LogOut className="w-4 h-4" />
              </button>
            </div>
          </div>

          {activeTab === 'quizzes' && (
            <div className="space-y-4">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <h3 className="font-bold text-slate-900 text-base flex items-center gap-2">
                  <Layers className="w-5 h-5 text-indigo-600" />
                  Danh Sách Đề Bài Tập
                </h3>

                <div className="flex items-center space-x-2 flex-wrap gap-y-2">
                  <label className="cursor-pointer bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm transition-all flex items-center gap-1.5" title="Giữ phím Ctrl để chọn nhiều file cùng lúc">
                    <Upload className="w-3.5 h-3.5" />
                    <span>Tải Đề Lên File Máy (Chọn Nhiều)</span>
                    <input 
                      type="file" 
                      accept=".json" 
                      multiple 
                      onChange={onImportQuizFile} 
                      className="hidden" 
                    />
                  </label>

                  <button
                    onClick={onExportAllQuizzes}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                    title="Xuất file .json của toàn bộ đề thi"
                  >
                    <Download className="w-3.5 h-3.5" />
                    <span>Xuất Tất Cả Đề</span>
                  </button>

                  <div className="flex items-center space-x-1 pl-2 border-l border-slate-200">
                    <span className="text-xs text-slate-500 font-medium">Lọc khối:</span>
                    <select
                      value={selectedGradeFilter}
                      onChange={(e) => setSelectedGradeFilter(e.target.value)}
                      className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="all">Tất cả ({quizzes.length} đề)</option>
                      <option value="10">Khối 10 ({quizzes.filter(q => q.grade === '10').length} đề)</option>
                      <option value="11">Khối 11 ({quizzes.filter(q => q.grade === '11').length} đề)</option>
                      <option value="12">Khối 12 ({quizzes.filter(q => q.grade === '12').length} đề)</option>
                    </select>
                  </div>
                </div>
              </div>

              {filteredQuizzes.length === 0 ? (
                <div className="bg-white rounded-2xl p-12 text-center border border-slate-200">
                  <AlertCircle className="w-10 h-10 text-amber-400 mx-auto mb-2" />
                  <p className="text-sm font-bold text-slate-700">Không tìm thấy đề thi phù hợp</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {filteredQuizzes.map((quiz) => (
                    <div key={quiz.id} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <span className="bg-indigo-50 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md">
                            Khối {quiz.grade} {quiz.isCTM2025 && '• CTM 2025'}
                          </span>
                          <span className="text-xs text-slate-500 font-medium flex items-center gap-1">
                            <Clock className="w-3.5 h-3.5" />
                            {quiz.duration} phút
                          </span>
                        </div>

                        <h4 className="font-bold text-slate-900 text-base mb-1">{quiz.title}</h4>
                        <p className="text-xs text-slate-600 line-clamp-2">{quiz.description}</p>
                      </div>

                      <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span className="text-xs text-slate-500">
                          {quiz.isCTM2025 ? '15 Câu (3 Phần)' : `${quiz.questions.length} câu`}
                        </span>

                        <div className="flex items-center space-x-2">
                          <button
                            onClick={() => {
                              setEditingQuiz(quiz);
                              if (quiz.isCTM2025) {
                                setActiveTab('ctm');
                              } else {
                                setActiveTab('create');
                              }
                            }}
                            className="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all flex items-center gap-1 text-xs font-semibold"
                            title="Chỉnh sửa đề thi này"
                          >
                            <Edit3 className="w-4 h-4" />
                            <span className="hidden sm:inline">Sửa</span>
                          </button>

                          <button
                            onClick={() => onExportSingleQuiz(quiz)}
                            className="p-2 text-emerald-600 hover:bg-emerald-50 rounded-lg transition-all flex items-center gap-1 text-xs font-semibold"
                            title="Tải file .json của đề này về máy"
                          >
                            <Download className="w-4 h-4" />
                            <span className="hidden sm:inline">Tải File</span>
                          </button>

                          <button
                            onClick={() => onDeleteQuiz(quiz.id)}
                            className="p-2 text-rose-600 hover:bg-rose-50 rounded-lg transition-all"
                            title="Xóa đề thi"
                          >
                            <Trash2 className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {activeTab === 'students' && (
            <div className="space-y-6">
              {pendingVipList.length > 0 && (
                <div className="bg-amber-50 border border-amber-300 rounded-2xl p-5 shadow-sm space-y-3">
                  <div className="flex items-center gap-2 text-amber-900 font-bold text-sm">
                    <Sparkles className="w-5 h-5 text-amber-600 animate-bounce" />
                    <span>Danh Sách Học Sinh Yêu Cầu Kích Hoạt VIP ({pendingVipList.length})</span>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {pendingVipList.map(st => (
                      <div key={st.phone} className="bg-white p-4 rounded-xl border border-amber-200 shadow-sm flex items-center justify-between">
                        <div>
                          <h4 className="font-bold text-slate-900 text-sm">{st.name}</h4>
                          <p className="text-xs text-slate-600">SĐT: <span className="font-mono font-bold">{st.phone}</span> • Khối {st.grade}</p>
                        </div>
                        <div className="flex items-center space-x-2">
                          <button
                            onClick={() => onApproveVip(st.phone)}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition-all"
                          >
                            Duyệt VIP
                          </button>
                          <button
                            onClick={() => onRejectVip(st.phone)}
                            className="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg transition-all"
                          >
                            Từ chối
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden space-y-4 p-5">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
                  <div>
                    <h3 className="font-bold text-slate-900 text-base flex items-center gap-2">
                      <UserCheck className="w-5 h-5 text-amber-600" />
                      Danh Sách Tài Khoản Học Sinh Đã Đăng Ký
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Tra cứu SĐT & Mật khẩu học sinh hoặc xuất danh sách tài khoản ra file Excel
                    </p>
                  </div>

                  <div className="flex items-center space-x-2 flex-wrap gap-y-2">
                    <label className="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm transition-all flex items-center gap-1.5 shrink-0" title="Tải lên danh sách tài khoản từ file CSV">
                      <Upload className="w-3.5 h-3.5" />
                      <span>Nhập DS (CSV)</span>
                      <input 
                        type="file" 
                        accept=".csv" 
                        onChange={handleImportStudentsCSV} 
                        className="hidden" 
                      />
                    </label>

                    <button
                      onClick={handleExportStudentsCSV}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm transition-all flex items-center gap-1.5 shrink-0"
                      title="Tải xuống danh sách tài khoản (SĐT và mật khẩu) dạng Excel/CSV"
                    >
                      <Download className="w-3.5 h-3.5" />
                      <span>Xuất DS (CSV)</span>
                    </button>

                    <div className="w-full sm:w-60">
                      <input
                        type="text"
                        placeholder="Tìm theo tên hoặc SĐT..."
                        value={searchStudentQuery}
                        onChange={(e) => setSearchStudentQuery(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 font-medium"
                      />
                    </div>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-700">
                    <thead className="bg-amber-50/60 text-amber-900 font-bold border-b border-amber-200/60 uppercase tracking-wider">
                      <tr>
                        <th className="px-5 py-3">STT</th>
                        <th className="px-5 py-3">Họ và Tên Học Sinh</th>
                        <th className="px-5 py-3">Khối Lớp</th>
                        <th className="px-5 py-3">Số Điện Thoại</th>
                        <th className="px-5 py-3">Mật Khẩu</th>
                        <th className="px-5 py-3">Trạng Thái</th>
                        <th className="px-5 py-3 text-right">Thao Tác</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredStudentsList.length === 0 ? (
                        <tr>
                          <td colSpan="7" className="text-center py-8 text-slate-400">
                            Chưa có học sinh nào phù hợp
                          </td>
                        </tr>
                      ) : (
                        filteredStudentsList.map((student, idx) => (
                          <tr key={student.phone} className="hover:bg-slate-50 transition-all">
                            <td className="px-5 py-4 text-slate-400 font-semibold">{idx + 1}</td>
                            <td className="px-5 py-4 font-bold text-slate-900">{student.name}</td>
                            <td className="px-5 py-4">
                              <span className="bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-md font-bold">
                                Khối {student.grade}
                              </span>
                            </td>
                            <td className="px-5 py-4 font-mono text-slate-800 font-bold text-sm">
                              {student.phone}
                            </td>
                            <td className="px-5 py-4">
                              {editingStudent === student.phone ? (
                                <div className="flex items-center space-x-2">
                                  <input
                                    type="text"
                                    value={newPasswordVal}
                                    onChange={(e) => setNewPasswordVal(e.target.value)}
                                    placeholder="Mật khẩu mới..."
                                    className="border border-amber-400 rounded-lg px-2 py-1 text-xs focus:outline-none"
                                    autoFocus
                                  />
                                  <button
                                    onClick={() => handleUpdateStudentPassword(student.phone)}
                                    className="bg-emerald-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold"
                                  >
                                    Lưu
                                  </button>
                                  <button
                                    onClick={() => setEditingStudent(null)}
                                    className="bg-slate-200 text-slate-700 px-2 py-1 rounded-lg text-xs"
                                  >
                                    Hủy
                                  </button>
                                </div>
                              ) : (
                                <span className="bg-amber-100 text-amber-900 font-mono font-bold px-2.5 py-1 rounded-md border border-amber-200">
                                  {student.password}
                                </span>
                              )}
                            </td>
                            <td className="px-5 py-4">
                              {student.isPremium ? (
                                <span className="bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-900 font-bold px-2.5 py-1 rounded-md text-[10px] shadow-sm">
                                  VIP
                                </span>
                              ) : student.pendingVip ? (
                                <span className="bg-rose-100 text-rose-800 font-bold px-2.5 py-1 rounded-md text-[10px] animate-pulse">
                                  Chờ duyệt VIP
                                </span>
                              ) : (
                                <span className="bg-slate-200 text-slate-700 font-bold px-2.5 py-1 rounded-md text-[10px]">
                                  Thường
                                </span>
                              )}
                            </td>
                            <td className="px-5 py-4 text-right space-x-2">
                              {!student.isPremium && student.pendingVip && (
                                <button
                                  onClick={() => onApproveVip(student.phone)}
                                  className="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold transition-all shadow-sm"
                                >
                                  Duyệt VIP
                                </button>
                              )}
                              {editingStudent !== student.phone && (
                                <button
                                  onClick={() => {
                                    setEditingStudent(student.phone);
                                    setNewPasswordVal(student.password);
                                  }}
                                  className="px-3 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-semibold transition-all border border-indigo-200"
                                >
                                  Đổi MK
                                </button>
                              )}
                              <button
                                onClick={() => handleDeleteStudent(student.phone)}
                                className="p-1 text-rose-600 hover:bg-rose-50 rounded-lg transition-all"
                                title="Xóa tài khoản này"
                              >
                                <Trash2 className="w-4 h-4" />
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'create' && (
            <QuizFormBuilder 
              editingQuiz={editingQuiz} 
              onSave={onSaveQuiz}
              onExportSingleQuiz={onExportSingleQuiz}
              onCancel={() => setActiveTab('quizzes')}
              showToast={showToast}
            />
          )}

          {activeTab === 'ctm' && (
            <CustomTemplateMatrixBuilder
              editingQuiz={editingQuiz}
              onSave={onSaveQuiz}
              onCancel={() => setActiveTab('quizzes')}
              showToast={showToast}
            />
          )}

          {activeTab === 'results' && (
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="p-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                  <h3 className="font-bold text-slate-900 text-base">Danh Sách Học Sinh Đã Nộp Bài</h3>
                  <p className="text-xs text-slate-500 mt-0.5">Theo dõi thời gian, số câu đúng và điểm số thực tế của học sinh</p>
                </div>
                
                <div className="flex items-center space-x-2">
                  <button
                    onClick={handleExportHistoryCSV}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                    title="Xuất file danh sách nộp bài dạng Excel/CSV"
                  >
                    <Download className="w-3.5 h-3.5" />
                    <span>Xuất DS Nộp Bài (CSV)</span>
                  </button>

                  <button
                    onClick={handleAnalyzeResults}
                    disabled={isAnalyzing}
                    className="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm transition-all flex items-center gap-2 disabled:opacity-70"
                  >
                    <Sparkles className={`w-4 h-4 ${isAnalyzing ? 'animate-spin text-yellow-300' : 'text-yellow-300'}`} />
                    <span>{isAnalyzing ? 'AI Đang Phân Tích...' : 'AI Đánh Giá Kết Quả'}</span>
                  </button>
                </div>
              </div>

              {aiAnalysis && (
                <div className="bg-purple-50 p-5 border-b border-purple-100">
                  <div className="flex items-center gap-2 mb-2">
                    <Bot className="w-5 h-5 text-purple-700" />
                    <h4 className="font-bold text-purple-900 text-sm">Nhận xét từ Chuyên gia AI:</h4>
                  </div>
                  <p className="text-sm text-purple-800 leading-relaxed italic">
                    {aiAnalysis}
                  </p>
                </div>
              )}

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs text-slate-700">
                  <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200 uppercase tracking-wider">
                    <tr>
                      <th className="px-5 py-3">Họ và Tên Học Sinh</th>
                      <th className="px-5 py-3">Khối Lớp</th>
                      <th className="px-5 py-3">Tên Đề Bài Tập</th>
                      <th className="px-5 py-3">Số Câu Đúng</th>
                      <th className="px-5 py-3">Thời Gian Nộp</th>
                      <th className="px-5 py-3 text-right">Điểm Số</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {submissionHistory.map((sub) => (
                      <tr key={sub.id} className="hover:bg-slate-50 transition-all">
                        <td className="px-5 py-4 font-bold text-slate-900">{sub.studentName}</td>
                        <td className="px-5 py-4">
                          <span className="bg-slate-100 text-slate-800 px-2 py-0.5 rounded font-semibold">
                            Khối {sub.grade}
                          </span>
                        </td>
                        <td className="px-5 py-4 font-medium text-slate-800">{sub.quizTitle}</td>
                        <td className="px-5 py-4 text-slate-600">
                          {sub.correctCount} / {sub.totalQuestions} câu
                        </td>
                        <td className="px-5 py-4 text-slate-500">{sub.submittedAt}</td>
                        <td className="px-5 py-4 text-right">
                          <span className={`font-bold px-2.5 py-1 rounded-lg text-sm ${
                            sub.score >= 8 
                              ? 'bg-emerald-100 text-emerald-800' 
                              : sub.score >= 5 
                              ? 'bg-blue-100 text-blue-800' 
                              : 'bg-rose-100 text-rose-800'
                          }`}>
                            {sub.score} / 10
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    function StudentView({ 
      currentStudent,
      registeredStudents,
      submissionHistory,
      onLogout,
      onRequestVip,
      onUpdateProfile,
      quizzes, 
      studentGrade, 
      setStudentGrade, 
      activeQuiz, 
      startQuiz, 
      exitQuiz,
      userAnswers,
      setUserAnswers,
      flaggedQuestions,
      setFlaggedQuestions,
      timeLeft,
      quizSubmitted,
      scoreResult,
      handleFinishQuiz,
      showToast
    }) {
      const [showSavedAccountModal, setShowSavedAccountModal] = useState(false);
      const [showUpgradeModal, setShowUpgradeModal] = useState(false);
      const [showQrModal, setShowQrModal] = useState(false);
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);

      const [editName, setEditName] = useState(currentStudent?.name || '');
      const [editGrade, setEditGrade] = useState(currentStudent?.grade || '12');
      const [editPassword, setEditPassword] = useState(currentStudent?.password || '');

      useEffect(() => {
        if (currentStudent) {
          setEditName(currentStudent.name || '');
          setEditGrade(currentStudent.grade || '12');
          setEditPassword(currentStudent.password || '');
        }
      }, [currentStudent]);

      const gradeQuizzes = quizzes.filter(q => q.grade === studentGrade);

      const studentHistory = (submissionHistory || []).filter(
        s => (s.studentPhone && s.studentPhone === currentStudent?.phone) || s.studentName === currentStudent?.name
      );

      const totalTests = studentHistory.length;
      const avgScore = totalTests > 0 ? (studentHistory.reduce((acc, curr) => acc + curr.score, 0) / totalTests).toFixed(1) : 0;
      const maxScore = totalTests > 0 ? Math.max(...studentHistory.map(s => s.score)) : 0;

      const handleProfileSubmit = (e) => {
        e.preventDefault();
        if (!editName.trim() || !editPassword.trim()) {
          showToast('Vui lòng điền đầy đủ thông tin!', 'info');
          return;
        }
        onUpdateProfile(editName.trim(), editGrade, editPassword.trim());
        setShowProfileModal(false);
      };

      if (activeQuiz) {
        if (activeQuiz.isCTM2025) {
          return (
            <ActiveCTMQuizTaking 
              quiz={activeQuiz}
              currentStudent={currentStudent}
              userAnswers={userAnswers}
              setUserAnswers={setUserAnswers}
              timeLeft={timeLeft}
              quizSubmitted={quizSubmitted}
              scoreResult={scoreResult}
              handleFinishQuiz={handleFinishQuiz}
              exitQuiz={exitQuiz}
              showToast={showToast}
            />
          );
        }

        return (
          <ActiveQuizTaking 
            quiz={activeQuiz}
            currentStudent={currentStudent}
            userAnswers={userAnswers}
            setUserAnswers={setUserAnswers}
            flaggedQuestions={flaggedQuestions}
            setFlaggedQuestions={setFlaggedQuestions}
            timeLeft={timeLeft}
            quizSubmitted={quizSubmitted}
            scoreResult={scoreResult}
            handleFinishQuiz={handleFinishQuiz}
            exitQuiz={exitQuiz}
            showToast={showToast}
          />
        );
      }

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-indigo-900 via-indigo-950 to-slate-900 text-white rounded-3xl p-6 shadow-md flex flex-col md:flex-row md:items-center justify-between gap-4 border border-indigo-800">
            <div>
              <div className="flex items-center space-x-2 flex-wrap gap-y-1">
                <span className="text-xs bg-emerald-400 text-slate-950 px-2.5 py-1 rounded-full font-extrabold uppercase tracking-wide flex items-center gap-1">
                  <CheckCircle className="w-3 h-3" /> Đã Đăng Nhập
                </span>
                <span className="text-xs text-indigo-200">
                  SĐT: <strong className="text-yellow-300 font-mono">{currentStudent?.phone}</strong>
                </span>
                {currentStudent?.isPremium ? (
                  <span className="text-[10px] bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wide shadow-sm flex items-center gap-1">
                    <Sparkles className="w-3 h-3" /> VIP
                  </span>
                ) : currentStudent?.pendingVip ? (
                  <span className="text-[10px] bg-rose-500 text-white font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wide animate-pulse">
                    Đang Chờ Giáo Viên Duyệt VIP
                  </span>
                ) : (
                  <span className="text-[10px] bg-slate-700 text-slate-200 font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wide">
                    Thường (Free)
                  </span>
                )}
              </div>
              <div className="flex items-center gap-2 mt-2">
                <h2 className="text-2xl font-bold">Xin chào, {currentStudent?.name}!</h2>
                <button
                  onClick={() => setShowProfileModal(true)}
                  className="p-1.5 bg-white/10 hover:bg-white/20 rounded-xl text-yellow-300 hover:text-white transition-all"
                  title="Chỉnh sửa họ tên, lớp, mật khẩu"
                >
                  <Edit3 className="w-4 h-4" />
                </button>
              </div>
              <p className="text-indigo-200 text-sm mt-1">
                Bạn đang truy cập bài tập của <strong>Khối Lớp {studentGrade}</strong>. Dưới đây là danh sách các đề thi trắc nghiệm.
              </p>

              <div className="mt-3 flex items-center gap-2 flex-wrap">
                <div className="bg-white/10 rounded-xl p-2.5 border border-white/10 text-xs text-indigo-100 flex items-center space-x-2 w-fit">
                  <Database className="w-4 h-4 text-emerald-400" />
                  <span>Tài khoản tự động lưu vĩnh viễn trên thiết bị này.</span>
                </div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 flex-wrap">
              <button
                onClick={() => {
                  if (currentStudent?.isPremium) {
                    setShowHistoryModal(true);
                  } else {
                    setShowUpgradeModal(true);
                  }
                }}
                className="flex items-center justify-center space-x-1.5 bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2.5 rounded-xl text-xs font-bold shadow-md transition-all border border-emerald-400/40"
              >
                {!currentStudent?.isPremium ? <Lock className="w-4 h-4 text-yellow-300" /> : <BarChart2 className="w-4 h-4 text-yellow-300" />}
                <span>Kết Quả Đã Làm ({studentHistory.length})</span>
              </button>

              <button
                onClick={() => setShowProfileModal(true)}
                className="flex items-center justify-center space-x-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-white px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all border border-indigo-400/40"
              >
                <User className="w-4 h-4 text-yellow-300" />
                <span>Sửa Thông Tin</span>
              </button>

              {currentStudent?.isPremium ? (
                <span className="flex items-center justify-center space-x-1.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-900 px-3.5 py-2.5 rounded-xl text-xs font-bold shadow-md cursor-default">
                  <Sparkles className="w-4 h-4" />
                  <span>Tài khoản VIP</span>
                </span>
              ) : currentStudent?.pendingVip ? (
                <span className="flex items-center justify-center space-x-1.5 bg-rose-600 text-white px-3.5 py-2.5 rounded-xl text-xs font-bold shadow-md cursor-default">
                  <Clock className="w-4 h-4 animate-spin" />
                  <span>Chờ giáo viên duyệt</span>
                </span>
              ) : (
                <button
                  onClick={() => setShowUpgradeModal(true)}
                  className="flex items-center justify-center space-x-1.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white px-3.5 py-2.5 rounded-xl text-xs font-bold shadow-md transition-all animate-pulse"
                >
                  <Award className="w-4 h-4" />
                  <span>Điều khoản Nâng Cấp</span>
                </button>
              )}

              <button disabled
                onClick={() => setShowSavedAccountModal(true)}
                className="flex items-center justify-center space-x-1.5 bg-indigo-900/80 hover:bg-indigo-800 text-white px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all border border-indigo-400/30"
                title="Danh sách các tài khoản lưu cục bộ"
              >
                <Users className="w-4 h-4 text-blue-200" />
                <span>Tài Khoản MASTER({registeredStudents ? registeredStudents.length : 0})</span>
              </button>

              <button
                onClick={onLogout}
                className="flex items-center justify-center space-x-1.5 bg-rose-600/80 hover:bg-rose-600 text-white px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all border border-rose-400/30"
              >
                <LogOut className="w-4 h-4" />
                <span>Đăng xuất</span>
              </button>
            </div>
          </div>

          <div>
            <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3 flex items-center gap-1.5">
              <Folder className="w-4 h-4 text-indigo-600" />
              Thư mục khối học của bạn:
            </h3>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              {[
                { gradeId: '10', title: 'Thư Mục Khối 10', subtitle: 'Đại số 10 & Hình học 10', iconColor: 'text-emerald-500', bgColor: 'bg-emerald-50 hover:bg-emerald-100/70', borderColor: 'border-emerald-200' },
                { gradeId: '11', title: 'Thư Mục Khối 11', subtitle: 'Lượng giác, Đạo hàm & Hình học không gian', iconColor: 'text-blue-500', bgColor: 'bg-blue-50 hover:bg-blue-100/70', borderColor: 'border-blue-200' },
                { gradeId: '12', title: 'Thư Mục Khối 12', subtitle: 'Giải tích 12 & Thi TN THPT Quốc gia', iconColor: 'text-purple-500', bgColor: 'bg-purple-50 hover:bg-purple-100/70', borderColor: 'border-purple-200' },
              ].map((folder) => {
                const isActive = studentGrade === folder.gradeId;
                const count = quizzes.filter(q => q.grade === folder.gradeId).length;

                return (
                  <button
                    key={folder.gradeId}
                    onClick={() => setStudentGrade(folder.gradeId)}
                    className={`p-5 rounded-2xl border text-left transition-all relative overflow-hidden flex items-start space-x-4 ${
                      isActive 
                        ? 'ring-2 ring-indigo-600 bg-white border-indigo-600 shadow-md' 
                        : `${folder.bgColor} ${folder.borderColor}`
                    }`}
                  >
                    <div className="p-3 bg-white rounded-xl shadow-sm border border-slate-100">
                      <FolderOpen className={`w-8 h-8 ${folder.iconColor}`} />
                    </div>

                    <div className="flex-1">
                      <div className="flex items-center justify-between">
                        <h4 className="font-bold text-slate-900 text-base">{folder.title}</h4>
                        {isActive && (
                          <span className="bg-indigo-600 text-white p-1 rounded-full text-xs">
                            <Check className="w-3.5 h-3.5" />
                          </span>
                        )}
                      </div>
                      <p className="text-xs text-slate-500 mt-1 leading-relaxed">{folder.subtitle}</p>
                      
                      <div className="mt-3 flex items-center text-xs font-semibold text-slate-600">
                        <span>{count} đề thi khả dụng</span>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          <div className="space-y-4 pt-2">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-slate-900 text-lg flex items-center gap-2">
                <Layers className="w-5 h-5 text-indigo-600" />
                Đề Luyện Tập Trong Thư Mục Khối {studentGrade}
              </h3>
            </div>

            {gradeQuizzes.length === 0 ? (
              <div className="bg-white rounded-2xl p-12 text-center border border-slate-200">
                <AlertCircle className="w-12 h-12 text-amber-400 mx-auto mb-3" />
                <h4 className="font-bold text-slate-800 text-base">Thư mục Khối {studentGrade} chưa có đề thi nào</h4>
                <p className="text-xs text-slate-500 mt-1">Giáo viên chưa cập nhật đề cho khối này.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {gradeQuizzes.map((quiz) => (
                  <div 
                    key={quiz.id} 
                    className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-all flex flex-col justify-between"
                  >
                    <div>
                      <div className="flex items-center justify-between mb-3">
